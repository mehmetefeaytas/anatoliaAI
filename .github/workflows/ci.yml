# Anatolia AI — sürekli entegrasyon
# TEKNOFEST 2026 TYDA 2. Senaryo · Şartname §9 (haftalık yükleme) ve §5.9 (offline)
#
# Tasarım ilkesi: BU DOSYADA SAHTE YEŞİL OLMAZ.
# Yalnızca gerçekten geçtiği doğrulanmış adımlar kapı (blocking) olarak konur.
# Henüz temizlenmemiş kalemler ayrı, bloklamayan işte ve GEREKÇESİYLE durur.
#
# Çekirdek testler ve değerlendirme katmanı SAF STDLIB ile çalışır — bu, on-prem
# iddiasının bir parçasıdır. Bu yüzden `test` işi hiçbir paket kurmaz; kurmak
# zorunda kalırsak bu bir mimari gerileme demektir ve CI bunu görünür kılar.
#
# Güvenlik notu: bu workflow hiçbir yerde `github.event.*` gibi denetlenmeyen
# girdiyi `run:` içine geçirmez — komut enjeksiyonu yüzeyi yoktur.

name: CI

on:
  push:
    branches: [main]
    tags: ["hafta-*", "teslim-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: Testler + değişmez denetimi (bağımlılıksız)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CLAUDE.md §7 asgari sürüm olarak Python 3.11 ilan ediyor.
      # Geliştirme makinesi 3.14 kullanıyor; asgari sürümü CI doğrular.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Ucuncu parti bagimlilik kurulmadigini dogrula
        run: |
          echo "Kurulu ucuncu parti paketler (bos olmali):"
          pip list --format=freeze | grep -v -E "^(pip|setuptools|wheel)==" || true

      # 3.552 gecen test (2026-08-21 olcumu). Saf stdlib oldugu icin hizli.
      #
      # Bu adim 4-12 Agustos arasi BES KOSU boyunca KIRMIZIYDI ve kimse
      # gormedi; kirmizi bir kapi, olmayan bir kapiyla ayni seydir. Iki kok
      # neden vardi, ikisi de "bagimlilik yok" ilkesinin kendisi degil,
      # ilkeye uymayan test dosyalariydi:
      #
      #   (a) 17 hata: fastapi KORUMASIZ import ediliyordu. Uc dosyada modul
      #       seviyesinde (unittest.loader._FailedTest), dort dosyada yardimci
      #       fonksiyon icinde (test basina hata, atlama DEGIL).
      #   (b) 8 basarisizlik + 3 hata: bs4 yokken HTML tablo ayristirmasi
      #       sessizce bos donuyor, test de dusuyordu.
      #
      # Cozum: `test_api_startup.py:37-41` deseni (probe + skipUnless).
      # Atlanan test SAYISI onemlidir: bagimliliksiz kosuda 205 test atlanir,
      # yani API yuzeyi burada SINANMAZ. Onu asagidaki `test-with-deps` isi
      # sinar. Iki is birlikte anlamli; yalniz biri yaniltir.
      - name: Birim ve entegrasyon testleri
        run: python -m unittest discover -s tests

      # Etiketsiz korpusta otomatik hata avi. Ihlal varsa cikis != 0.
      # Bu adim projenin en ozgun teknik iddiasi; kapi olarak durmasi gerekiyor.
      - name: Degismez (invariant) denetimi
        run: python -m eval.properties --raw-dir data/raw

      # Katilim jargonu denetimi. Kullaniciya/modele donuk metinde
      # konvansiyonel bankacilik terimi (faiz/kredi/mevduat) bulunursa kirilir.
      #
      # Kapsam bilincli olarak dar. Kor tarama tum repoda 494 bulgu veriyordu ve
      # neredeyse hepsi mesruydu: eslestirici sabitler yasak terimi ICERMEK
      # ZORUNDA (onlari banka metninde ariyorlar), belgeler ayrimi anlatiyor,
      # fiksturlar gercek banka metnini alintiliyor. 494 bulgu basan bir lint
      # kimsenin kosmadigi bir linttir — ruff isindeki "sifir bulgu" ilkesinin
      # aynisi.
      - name: Jargon denetimi
        run: python -m scripts.jargon_lint

      - name: Degerlendirme hatti duman testi
        run: python -m eval.run_eval --gold data/gold/gold.sample.json

      # REGRESYON KAPISI (plan G1.5). Duman testinden farki: o, hattin
      # CALISTIGINI dogrular; bu, SONUCUN GERILEMEDIGINI.
      #
      # FAZ 1'de uc alan olculerek duzeltildi (vade_ay 0,133 -> 0,545,
      # kar_payi_orani 0,500 -> 0,800, indirim_orani 0,000 -> 0,400). Bir
      # regex'i gevsetmek baska bir alani bozabilir ve kimse fark etmeyebilir;
      # kapi tam olarak bunu yakalar. Alan bazinda F1, yapisal mikro-F1 ve
      # halusinasyon oraninin UST siniri birlikte korunur.
      #
      # Esikler gold.v2.json uzerinde olculdu. Gold buyudugunde (plan G3.1)
      # sayilar dogal olarak degisir; eval/esikler.json BILEREK ve gerekcesi
      # commit mesajina yazilarak guncellenir. Sessizce dusurmek kapinin
      # varlik sebebini ortadan kaldirir.
      #
      # --no-bootstrap: guven araligi kapiyi ilgilendirmez, kosumu hizlandirir.
      # Sabit komut; disaridan gelen hicbir girdi kullanilmaz.
      - name: Eval regresyon kapisi
        run: |
          python -m eval.run_eval --gold data/gold/gold.v2.json \
            --matcher strict --no-bootstrap --esikler eval/esikler.json

      # IKINCI KAPI, AYRI TABAN. gold.v2 ile gold.round1 ayni sistemi olcer
      # ama AYNI SORUYU SORMAZ:
      #   gold.v2      48 kayit ·  40'i kasten ZOR · 444 `absent` karari
      #   gold.round1 134 kayit ·   3'u zor       ·  60 `absent` karari
      #
      # Tek bir esik listesi ya zor sette gevsek ya genis sette anlamsiz
      # olurdu, bu yuzden iki dosya. `esikler-round1.json` halusinasyon
      # tavani TANIMLAMAZ ve bu bilerekdir: round1'in `absent` kumesi
      # dusmanca secilmis (bir hucre inceleme kuyruguna zaten model bir sey
      # urettigi icin giriyor), oran 0,047 yerine 0,433 cikiyor. O sayiya
      # bakip onceden ilan edilmis 0,08 tavanini gevsetmek, ANNOTATION_GUIDE
      # §7'nin yasakladigi seyin ta kendisi olurdu. Tavan gold.v2'de KALIR.
      # Sabit komut; disaridan gelen hicbir girdi kullanilmaz.
      - name: Eval regresyon kapisi (round1 tabani)
        run: |
          python -m eval.run_eval --gold data/gold/gold.round1.json \
            --matcher strict --no-bootstrap --esikler eval/esikler-round1.json

      # Gold kaydinin kaynagi ham arsive kadar izlenebilmeli: cikarilmis metin
      # -> ham HTML -> source_url + scraped_at. "Provenance var" demek yetmez,
      # KOSULABILIR olmali; iddia ile kanit arasindaki fark budur.
      #
      # Kapi icerik KAYMASINDA kapanmaz (sayfa anotasyondan sonra tazelenmis
      # olabilir; anote edilen metin gold kaydinin icinde durur). Yalnizca
      # kaynagi hic bulunamayan ya da scraped_at/source_url'u eksik-celiskili
      # kayit kirmizi yapar.
      - name: Gold kanit zinciri
        run: python -m scripts.kanit_zinciri --gold data/gold/gold.v2.json

      # Depo temizligi (izlenen .md sayisini dusurmek) linkleri SESSIZCE kirar:
      # `git rm --cached` dosyayi diskte birakir, bu yuzden temizligi yapanin
      # makinesinde her link calismaya devam eder. Kiriklik yalniz temiz bir
      # klonda gorunur — yani ilk fark eden juri olur. Bu adim `git ls-files`
      # uzerinden gider, yani depodaki gercegi olcer.
      - name: Markdown link denetimi
        run: python -m scripts.link_denetimi

      # Bu projenin tek farklilastiricisi olcum durustlugu. O yuzden en pahali
      # hata sinifi, YAYIMLANAN bir sayinin koddan sapmasidir: juri "README
      # 0,302 diyor ama isaret ettigi rapor 'olculemedi' diyor" derse
      # kaybedilen o satir degil TUM olcum iddiasidir.
      #
      # 15 Agustos'ta olculdu: test sayisi, korpus buyuklugu, bootstrap ornek
      # sayisi ve kar_payi_orani F1'i belgelerde yanlisti. Tek tek duzeltmek
      # yetmez -- 12 Agustos'tan beri ucuncu kez oluyordu.
      #
      # --kanit-eksigi-uyari: her commit'te tam olcum artefakti beklenemez
      # (data/demo.db git'te izlenmiyor, eval raporu her commit'te uretilmiyor).
      # SAPMA yine de kirmizi yakar; gevseyen sey yalniz "kanit uretilemedi".
      # Teslim oncesi `make kanit` bu bayragi KULLANMAZ.
      # Sabit komut; disaridan gelen hicbir girdi kullanilmaz.
      - name: Kanit tazeligi kapisi
        run: python -m scripts.kanit_tazeligi --kanit-eksigi-uyari

      # Model agirligi lisanslari denetleniyordu (NOTICE, model-license-audit),
      # ama CALISMA ZAMANI paketleri denetlenmiyordu: 96 paketin 80'i gecisli
      # bagimlilikti ve hicbiri goze gorunmemisti. Sartname acik kaynak sarti
      # koyuyor; Apache-2.0 bir depoya copyleft bir bagimlilik girerse bu bir
      # uslup tercihi degil UYUM IHLALIDIR.
      #
      # Kapi `docs/sbom.json` (CycloneDX) uzerinden kosar -- commit'li oldugu
      # icin bagimliliksiz iste de calisir. UNKNOWN lisans SESSIZ GECMEZ:
      # denetlenmemis paket, temiz paket degildir.
      # Sabit komut; disaridan gelen hicbir girdi kullanilmaz.
      - name: Lisans kapisi
        run: python -m scripts.lisans_kapisi

      # Demo DB korpusla ayrisirsa chatbot/dashboard/RAG korpusun bir kismini
      # SESSIZCE gormez. Bir kez yasandi: DB 31 Temmuz'da 849 belgeyle
      # kuruldu, korpus 3 Agustos'ta 1761'e cikti, bir hafta boyunca hicbir
      # test kirilmadi. `data/demo.db` git'te izlenmedigi icin CI'da tipik
      # olarak atlanir; kapi asil YEREL kosuda ve demo provasinda is gorur.
      - name: Demo DB tazeligi
        run: python -m scripts.check_demo_db --db-yoksa-gec

      # Bu adim BOS YESILDI ve tam olarak bu dosyanin reddettigi seydi.
      # `src/api/main.py` sonunda `try: app = build_app() / except RuntimeError:
      # app = None` var. `build_app()` fastapi yoksa RuntimeError atiyor; bu
      # isde fastapi HIC kurulmadigi icin istisna HER ZAMAN yakalaniyor,
      # `app` None oluyor ve adim "API import OK" basiyordu. Yani adim
      # `build_app()` tamamen silinse bile gecerdi.
      #
      # Dogru yer `test-with-deps`: orada fastapi gercekten kurulu, dolayisiyla
      # `build_app()` gercekten cagriliyor ve dondurdugu sey dogrulanabiliyor.
      # Burada yalnizca modulun SOZDIZIMSEL olarak yuklenebildigi sinanir --
      # iddia bu kadar oldugu icin adin da bu kadarini soylemesi gerekir.
      - name: API modulu bagimliliksiz da YUKLENEBILIYOR
        run: python -c "import src.api.main; print('modul yuklendi (app=None beklenir)')"

  test-with-deps:
    # NEDEN IKINCI BIR TEST ISI VAR.
    #
    # Yukaridaki `test` isi hicbir paket kurmuyor ve bu bilincli: cekirdegin
    # saf stdlib ile kostugu, on-prem iddiasinin olculebilir parcasi. Ama o
    # ilkenin bir yan etkisi olcusuz kalmisti: bagimliliksiz kosuda 205 test
    # ATLANIYOR. Atlananlarin icinde 18 FastAPI test dosyasinin TAMAMI var --
    # yani API yuzeyi (28 uc, dogrulama, 404/409/501/503 sozlesmeleri, ozet
    # onbellegi, banka-delta, per-bank kiyas) CI'da hic kosmuyordu.
    #
    # "Atlandi" CI ciktisinda yesil gorunur. Bir yuzeyi sinamamak ile onu
    # sinayip gecmek arasindaki farki gizleyen tek sey buydu.
    #
    # Bu is o farki kapatir: bagimliliklari kurar ve AYNI test paketini kosar.
    #
    # OLCULEN SONUC (kosu 31643710122): atlama 210 -> 128, yani 82 test
    # gercekten kostu ve `API ayakta, 34 yol kayitli` dogrulandi.
    #
    # 128 NEDEN SIFIR DEGIL -- ikisi de mesru, ucuncusu bir bulgu:
    #   ~53  Postgres yok ("ANATOLIA_TEST_DATABASE_URL tanimli degil").
    #        Canli sunucu gerekiyor; compose'da `db-check` servisi var ama
    #        hicbir is onu ayaga kaldirmiyor. Postgres yolu bu yuzden hala
    #        yalnizca 3 fixture belgesiyle dogrulanmis durumda -- ACIK BULGU.
    #   ~75  playwright / transformers / trafilatura. Bunlar teslim edilen
    #        CALISMA ZAMANI kumesinde BILEREK yok (ince imaj + lisans
    #        gerekcesi, bkz. Dockerfile.api). Kurulmadiklari icin degil,
    #        kurulmamalari gerektigi icin atlaniyorlar.
    #
    # Yani bu is "her sey kostu" demiyor; "API yuzeyi artik gercekten
    # sinaniyor" diyor. Farki yazmak, sayiyi yuvarlamaktan iyidir.
    name: Testler (bagimliliklar kurulu) + API gercekten ayaga kalkiyor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Teslim edilen imajin kurdugu kume (Dockerfile.api ile ayni dosya).
      # Gelistirme kumesi (requirements.txt) BILEREK kurulmuyor: burada
      # sinanan sey, KOSAN sistemin bagimliliklariyla testlerin gectigidir.
      - name: Calisma zamani bagimliliklarini kur
        working-directory: app
        run: pip install -r requirements-api.txt

      # SADECE TEST ARACI — `requirements-api.txt`e EKLENMEDI.
      #
      # `fastapi.testclient.TestClient` starlette uzerinden `httpx2` istiyor
      # (starlette 1.6'da `httpx` -> `httpx2` oldu). Bu bir CALISMA ZAMANI
      # bagimliligi degil: API uretimde uvicorn ile kosuyor, TestClient'a
      # dokunmuyor. Teslim edilen imajin bagimlilik kumesini test araciyla
      # sismanlatmak, `Dockerfile.api`da trafilatura'nin lisans gerekcesiyle
      # DISARIDA birakildigi ince-imaj disiplinini bozardi.
      #
      # Olculdu (kosu 31642385024): bu paket olmadan fastapi kurulu olsa bile
      # 17 test HATA veriyordu ve is kirmizi yaniyordu.
      - name: Test araci bagimliligi (yalniz CI)
        run: pip install httpx2

      - name: Birim ve entegrasyon testleri (atlama ~0 olmali)
        working-directory: app
        run: python -m unittest discover -s tests

      # `test` isindeki kardes adimin BOS YESIL olmasinin sebebi burada yok:
      # fastapi kurulu, dolayisiyla `build_app()` gercekten cagriliyor ve
      # None DONMEDIGI dogrulaniyor. Adim, var olma sebebi icin dusebilir.
      # KAPI GERCEK ISTEK ATAR, route listesine BAKMAZ (19 Agu 2026'da
      # degistirildi). Eski hali `app.routes` uzerinden yol adi topluyordu ve
      # API katmani router'lara bolununce kirildi:
      # `AttributeError: '_IncludedRouter' object has no attribute 'path'`.
      #
      # Sebep FastAPI 0.141'in ic detayi: `include_router` ile eklenen uclar
      # `app.routes` icinde bir sarmalayici nesne olarak duruyor, yol adiyla
      # DEGIL. Olculdu: uclar calisiyor (TestClient 200 donduruyor) ama
      # listede gorunmuyor. Yani eski kapi, calisan bir sistemde "uc kayboldu"
      # diyordu -- yanlis alarm; tersi de mumkundu (liste dolu, yonlendirme
      # bozuk).
      #
      # TestClient ile istek atmak bu ic detaydan bagimsizdir: 404 DISI her
      # kod ucun gercekten yonlendirildigini kanitlar (422 = ucta zorunlu
      # parametre var, yani yol BULUNDU). 404 ise uc kaybolmustur.
      # Sabit komut; disaridan gelen hicbir girdi kullanilmaz.
      - name: API gercekten kuruluyor (uclar istek aliyor)
        working-directory: app
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from src.api.main import build_app
          app = build_app()
          assert app is not None, 'build_app() None dondu'
          c = TestClient(app)
          for uc in ('/health', '/banks', '/campaigns', '/compare', '/chat'):
              kod = c.get(uc).status_code
              assert kod != 404, f'uc kayboldu: {uc}'
              print(f'  {uc} -> {kod}')
          print('API ayakta, 5 uc yonlendiriliyor')
          "

  postgres:
    # NEDEN AYRI BIR IS VAR.
    #
    # `test-with-deps` isinde 53 test "Postgres yok" diye ATLANIYORDU ve
    # atlama CI ciktisinda yesil gorunur. Sonucu somut: sistemin IKI veri
    # tabani arka ucu var (SQLite + Postgres/pgvector), ikisinin AYNI cevabi
    # verdigi iddiasi `tests/test_repo_parity.py` ile yazilmis ama o test
    # CI'da hic kosmamis. `docker-compose.yml` icindeki `db-check` servisi
    # tam bu isi yapiyor -- ama hicbir CI isi onu ayaga kaldirmiyordu.
    #
    # Yani "Postgres yolu calisiyor" iddiasi bugune kadar YALNIZ ELDE
    # dogrulanmisti. compose dosyasi bunu kendisi itiraf ediyor: korpusu
    # SQLite'tan Postgres'e tasiyan bir betik yok, tasima elle yapildi.
    #
    # Bu is o bosluga kapi koyar. Korpus tasima sorununu COZMEZ (o ayri bir
    # is): sinanan sey semanin kurulabildigi, iki arka ucun ayni sozlesmeyi
    # verdigi ve `embeddings` tablosunun `<=>` ile gercekten sorgulanabildigi.
    name: Postgres/pgvector paritesi
    runs-on: ubuntu-latest

    services:
      postgres:
        # DIGEST SABITLI ve `docker-compose.yml`dekiyle AYNI imaj. Ayni
        # dosyada iki farkli pgvector surumu tutmak, CI'da gecen bir seyin
        # demoda gecmemesi anlamina gelirdi.
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_USER: anatolia
          POSTGRES_PASSWORD: anatolia
          POSTGRES_DB: anatolia
        ports: ["5432:5432"]
        # Kap hazir olmadan testi baslatmak yaris kosulu yaratir; testler
        # "baglanamadim" diye ATLAR ve is yine sahte yesil yanar.
        options: >-
          --health-cmd "pg_isready -U anatolia -d anatolia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Calisma zamani bagimliliklarini kur
        working-directory: app
        run: pip install -r requirements-api.txt

      # `test_api_backend.py` ucları BILEREK `TestClient` uzerinden cagiriyor
      # (FastAPI'nin threadpool'unda kosmasi icin), o yuzden burada da test
      # araci gerekiyor. `requirements-api.txt`e EKLENMEZ -- gerekcesi
      # `test-with-deps` isindeki ayni adimda yazili.
      - name: Test araci bagimliligi (yalniz CI)
        run: pip install httpx2

      # `vector` uzantisini KOD kuruyor (`src/db/schema.sql:5`,
      # CREATE EXTENSION IF NOT EXISTS), o yuzden burada elle kurmuyoruz --
      # kurarsak sinanan sey semanin kendisi olmaktan cikardi.
      - name: Postgres gercekten ayakta ve pgvector var
        env:
          PGPASSWORD: anatolia
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect(
                  "postgresql://anatolia:anatolia@localhost:5432/anatolia") as c:
              c.execute("CREATE EXTENSION IF NOT EXISTS vector")
              c.commit()
              sur = c.execute("SELECT version()").fetchone()[0]
              ext = c.execute(
                  "SELECT extversion FROM pg_extension "
                  "WHERE extname='vector'").fetchone()
          print("postgres:", sur.split(",")[0])
          print("pgvector:", ext[0] if ext else "YOK")
          assert ext, "pgvector uzantisi kurulamadi"
          PY

      # ATLAMA SAYISI BURADA KAPIDIR. Testler on kosul yoksa kendilerini
      # atliyor (dogru davranis) -- ama bu iste atlamak, isin var olma
      # sebebini ortadan kaldirir. Bu yuzden atlanan test sayisi 0 olmali ve
      # degilse is KIRILIR: sessizce "gecti" demesini engelleyen tek sey bu.
      - name: Postgres paritesi + pgvector testleri (atlama = HATA)
        working-directory: app
        env:
          ANATOLIA_TEST_DATABASE_URL: postgresql://anatolia:anatolia@localhost:5432/anatolia
        run: |
          python - <<'PY'
          import sys, unittest
          adlar = ["tests.test_pgvector_repository",
                   "tests.test_repo_parity",
                   "tests.test_api_backend"]
          paket = unittest.TestLoader().loadTestsFromNames(adlar)
          sonuc = unittest.TextTestRunner(verbosity=2).run(paket)
          print(f"\nkosan={sonuc.testsRun} hata={len(sonuc.errors)} "
                f"basarisiz={len(sonuc.failures)} atlanan={len(sonuc.skipped)}")
          for test, sebep in sonuc.skipped:
              print(f"  ATLANDI: {test} -> {sebep}")
          if sonuc.skipped:
              sys.exit("Postgres isinde test ATLANDI: on kosul kurulamamis, "
                       "yani bu is bir sey dogrulamiyor.")
          sys.exit(0 if sonuc.wasSuccessful() else 1)
          PY

  lint:
    # ARTIK KAPI (31 Tem 2026 aksami).
    #
    # Sabah bu is `continue-on-error: true` idi: ruff yapilandirmasizdi ve
    # varsayilan kural kumesiyle 479 bulgu veriyordu. Dagilim sorunun kod
    # olmadigini gosterdi — 247'si `Optional[X]` -> `X | None` kozmetigi.
    #
    # `app/pyproject.toml`'da kural kumesi ACIKCA secildi (defekt yakalayanlar
    # acik, uslup tercihi olanlar gerekcesiyle kapali) ve kalan gercek bulgular
    # duzeltildi; ikisi olcum katmaninda sessiz `zip` kirpmasiydi. Repo simdi
    # SIFIR bulgu veriyor, dolayisiyla is bloklayici olabilir.
    #
    # Bir linter ancak sifir bulguda anlamlidir: kalici bir bulgu listesi
    # varsa yeni bulgu gurultude kaybolur.
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # SURUM PINLI — `pip install ruff` pinsizdi ve surukleniyordu:
      # 19 Agu 2026'da yerelde 0.16.1, CI'da 0.16.3 kuruluyordu. Ayni
      # komut iki ortamda farkli kural kumesi kosarsa kapi "gecti/kaldi"
      # kararini surum piyangosuna baglar. Surum `app/requirements.txt`
      # ile AYNI tutulmali; degistirildiginde ikisi birlikte guncellenir.
      - run: pip install ruff==0.16.3
      - name: ruff check
        # Yapilandirma ve kapsam app/pyproject.toml'dan okunur.
        run: ruff check .
      # CLAUDE.md ile AGENTS.md elle senkron IKIZ dosyalardir; tek mesru fark
      # klasor semasinda kendi adini yazan satirdir (su an 63). Sessiz ayrisma
      # bu kapiyla yakalanir; satir numarasi kayarsa iki dosyada birlikte
      # guncellenir.
      - name: CLAUDE.md - AGENTS.md ikizlik kapisi
        run: diff <(sed '63d' CLAUDE.md) <(sed '63d' AGENTS.md)

  web:
    # Bu is sadece derliyordu: `npm run build` gecerse yesil yaniyordu.
    # `package.json` ise 20 kumede 70 test tanimliyor ve HICBIRI CI'da
    # kosmuyordu — yani frontend yardimcilari (sure/ilerleme/hata gerekcesi)
    # yalnizca yerelde, biri hatirlarsa sinaniyordu. Derleme bir tip hatasini
    # yakalar, yanlis Turkce etiketi yakalamaz.
    name: Frontend testleri + derlemesi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 20 DEGIL, ve bu surum secimi testlerin ON KOSULU:
      # `npm test` .ts dosyalarini dogrudan kosuyor (yeni test bagimliligi
      # eklenmedi — offline + lisans kisiti). Bunun icin gereken tip siyirma
      # (type stripping) Node'a 22.18'de bayraksiz girdi. Node 20'de ayni
      # komut "unknown file extension .ts" ile duser; yani testleri eski bir
      # kosucuyla eklemek, kapiyi kirik takmak olurdu.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bagimliliklari kur
        working-directory: app/web
        run: npm install

      # Derlemeden ONCE kosar: kirik bir yardimci, derlemenin bitmesini
      # beklemeden gorunur olsun.
      - name: Birim testleri
        working-directory: app/web
        run: npm test

      - name: Derle
        working-directory: app/web
        run: npm run build

      # `npm run lint` (= `next lint`) BILEREK EKLENMEDI — bu dosyanin
      # "sahte yesil olmaz" ilkesinin kardesi: kirik kapi da takilmaz.
      #
      # Olculdu (2026-08-12, `npx next lint`): komut denetim yapmiyor, kurulum
      # sihirbazi aciyor ve TTY olmayan ortamda cikis kodu 1 veriyor:
      #
      #   ? How would you like to configure ESLint?
      #   > Strict (recommended) / Base / Cancel
      #
      # Sebep: `eslint` ve `eslint-config-next` `package.json`'da YOK ve
      # `web/` altinda hicbir eslint yapilandirmasi yok. Bu adim bugun
      # eklenseydi her kosuda kirmizi yanar, kimse bakmaz hale gelirdi —
      # ruff isindeki 479 bulgulu donemin aynisi.
      #
      # Kapi olmasi icin once su ikisi inmeli (bagimlilik eklemek CLAUDE.md
      # §22 geregi ayri bir onay ister): devDependencies'e `eslint` +
      # `eslint-config-next`, ve `web/.eslintrc.json`. Ikisi indiginde buraya
      # `run: npm run lint` adimi eklenir.
