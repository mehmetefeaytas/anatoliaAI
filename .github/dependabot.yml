# Bağımlılık güncelleme botu — haftalık, üç ekosistem.
# Pinli sürüm disiplini (app/requirements.txt başlığı) elle takip yerine
# burada otomatik PR'a bağlanır; PR'ı birleştiren SBOM'u da yeniden üretir.
#
# ## MAJOR SÜRÜMLER YOK SAYILIYOR (2026-08-24)
#
# Botun ilk koşumu (23 Ağu) geride kalmış her şeyi tek seferde PR'ladı: 13 PR,
# yarısı kırıcı sürüm atlaması — `next` 14→16, `react-dom` 18→19, `typescript`
# 5→7, `@types/node` 20→26, GitHub Actions 4/5→7.
#
# Teslim yakınken major yükseltme, ölçülmüş bir kazanç getirmeden üç şeyi
# birden riske atıyor: çalışan arayüz (App Router kırıcı değişiklikleri), CI
# kapıları ve SBOM sapma kapısı (`make sbom-sapma`, envanter birebir tutmalı).
#
# `ignore` kuralı botu SUSTURMUYOR: yama ve küçük sürümler gelmeye devam
# ediyor, yani güvenlik düzeltmeleri kaçmıyor. Yalnız kırıcı sürüm atlamaları
# dışarıda kalıyor. Teslimden sonra bu blok kaldırılıp yükseltmeler tek tek
# ölçülerek alınabilir.
#
# ## BOT TAMAMEN DURAKLATILDI — 29 AĞUSTOS'A KADAR (2026-08-24)
#
# `open-pull-requests-limit: 0` botu susturur: tarama sürer ama PR AÇILMAZ.
# `ignore` kuralı yeterli değildi — major'lar kesildikten sonra bot aynı
# paketleri major-içi sürümlerle yeniden PR'ladı (ruff 0.16.4, typescript
# 5.9.3, next 14.2.35, @types/node 20.19.43) ve haftalık koşum bunu tekrar
# edecekti.
#
# Karar teslim tarihine bağlı: yarışma 29 Ağustos 2026. O güne kadar hiçbir
# yükseltme ölçülmüş bir kazanç getirmiyor, buna karşılık her birleştirme
# SBOM'un yeniden üretilmesini (97 paket) ve 3.948 testin yeniden koşmasını
# gerektiriyor.
#
# BİLİNEN BEDELİ AÇIKÇA YAZIYORUZ: bu ayarla güvenlik yamaları da gelmiyor.
# Bilinen ve KABUL EDİLEN tek açık `next` 14.2.5'tir (CVE-2025-55184 yüksek,
# CVE-2025-55183 orta — ikisi de React Server Components katmanında). Panel
# yalnız localhost'ta koşuyor ve depoda `middleware.ts` yok; risk bu koşullarda
# kabul edildi. PR #17 aynı gerekçeyle kapatıldı.
#
# 29 AĞUSTOS'TAN SONRA: `open-pull-requests-limit` satırlarını sil, `ignore`
# bloğunu da kaldırmayı değerlendir, `next` yamasını İLK alınacak yükseltme
# olarak sıraya koy.
version: 2
updates:
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    # 0 = PR açma. 29 Ağustos'tan sonra bu satırı sil.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /app/web
    schedule:
      interval: weekly
    # 0 = PR açma. 29 Ağustos'tan sonra bu satırı sil.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # 0 = PR açma. 29 Ağustos'tan sonra bu satırı sil.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
