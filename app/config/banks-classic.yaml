  - slug: qnb
    name: QNB
    website_url: https://www.qnb.com.tr
    # js ZORUNLU: arşiv sayfasında GERÇEK sayfalama var ve sayfa değişince URL
    # DEĞİŞMİYOR. 2026-08-04 ölçümü (BrowserFetcher.fetch_all_pages ile canlı):
    # /kampanyalar/arsivdeki-kampanyalar → 6 sayfa, her sayfada 9-10 YENİ
    # bağlantı, toplam 55 tekil. Sayfalama olmadan yalnızca 10 kampanya
    # görünüyordu → 5,5 kat kayıp. Sayfalama yalnızca BrowserFetcher'da
    # çalışıyor (StaticFetcher'da fetch_all_pages yok), bu yüzden static'te
    # bu kazanç ERİŞİLEMEZ.
    #
    # KARŞILAŞTIRMA: Kuveyt Türk ve Albaraka arşivlerinde de sayfalama
    # denetimi bulunuyor ama tıklamak YENİ bağlantı getirmiyor (16/0/0/0/0 ve
    # 53/0/0/0/0) — onlar promo karuseli, kampanya sayfalaması değil. Bu ayrım
    # ölçülerek yapıldı, DOM'da denetim görmek tek başına kanıt değil.
    scrape_mode: js
    campaign_paths:
      - /kampanyalar
      - https://www.cardfinans.com.tr/kampanyalar
    archive_paths:
