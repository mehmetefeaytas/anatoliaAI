      # doğrulandı; tahmin edilen Akbank/İş Bankası/DenizBank/VakıfBank
      # karşılıkları 404 döndü, onlar yazılmadı.
      - /tr/bireysel/krediler/konut-kredileri.html
      - /tr/bireysel/kampanyalar
      - /tr/bireysel
      - https://www.paraf.com.tr/tr/kampanyalar.html
      - https://www.paraf.com.tr/tr/kampanyalar/akaryakit.html
      - https://www.paraf.com.tr/tr/kampanyalar/market.html
      - https://www.paraf.com.tr/tr/kampanyalar/e-ticaret.html
      - https://www.paraf.com.tr/tr/kampanyalar/beyaz-esya-ve-elektronik.html
      - https://www.paraf.com.tr/tr/kampanyalar/giyim-kozmetik-ve-aksesuar.html
      - https://www.paraf.com.tr/tr/kampanyalar/kafe-ve-restoran.html
      - https://www.paraf.com.tr/tr/kampanyalar/seyahat.html
      - https://www.paraf.com.tr/tr/kampanyalar/otomotiv.html
      - https://www.paraf.com.tr/tr/kampanyalar/diger-firsatlar.html
    sitemap_urls:
      - https://www.halkbank.com.tr/tr.sitemap.xml
    detail_patterns:
      - kredi
      - mevduat
      - kart
      - kampanya
    exclude_patterns:
      - /en/
      - /basin
      - /duyuru
    max_docs: 45

