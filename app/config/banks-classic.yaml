    # 27 kategori sayfası var. extra_hosts olmadan bu alan "site dışı" sayılıp
    # tamamen atlanır (TOM Bank → tombankhadi.com ile aynı kalıp).
    # paraf.com.tr'de robots.txt YOK (HTTP 404) → kısıt bildirilmemiş.
    extra_hosts:
      - paraf.com.tr
    campaign_paths:
      # 2026-08-04: Konut/Taşıt ÜRÜN sayfaları — sınıf dengesi için hedefli
      # eklendi. Etiketleme ölçümü: 502 belgede Konut 13, Taşıt 9 çıktı
