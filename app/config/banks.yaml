    # ÖNCE: TOM Katılım korpusun EN SIĞ bankasıydı — 19 belge, hiç PDF yok.
    # Sebep keşif başlangıcı eksikliğiydi: `sitemap_urls` HİÇ tanımlı değildi,
    # yani keşif yalnız 3 liste sayfasından yürüyordu.
    #
    # ÖLÇÜLDÜ (curl, tahmin DEĞİL):
    #   www.tombank.com.tr/sitemap.xml  → HTTP 404 (kurumsal sitede sitemap YOK)
    #   www.tombank.com.tr/robots.txt   → HTTP 404 (kural yok)
    #   tombankhadi.com/sitemap.xml     → HTTP 200, application/xml, 235 <loc>
    #   tombankhadi.com/robots.txt      → "User-agent: * / Allow: /" +
    #                                      "Disallow: /*arama-sonuclari?q="
    # Aşağıdaki `detail_patterns` ile eşleşen aday 162; bunların 14'ü korpusta
    # zaten var → **148 YENİ aday** (ölçüm: `matches()` + mevcut meta.json'lar).
    # Arama sonucu sayfası `DEFAULT_EXCLUDE_PATTERNS`taki `/arama` ile zaten
    # eleniyor, yani robots'un tek Disallow kuralına dokunulmuyor.
    sitemap_urls:
      - https://tombankhadi.com/sitemap.xml
    detail_patterns:
      - /kampanyalar/
      # Bu desen SİTEMAP'TEN ÖNCE eklenmişti: o zaman `/kampanyalar/` ağacı
      # keşifte görünmüyordu ve kampanyalara ancak bu yoldan ulaşılıyordu.
      # Sitemap eklendikten sonra ARTIK TAMAMEN GEREKSİZ ve zararlı oldu —
      # aşağıdaki `exclude_patterns` onu nötrleyor. Satır silinmedi ki niyeti
      # ve neden düştüğü kayıtta kalsın.
      - /cok-kazananlar-kulubu-kampanya/
      - kampanyalar.html
      - urunlerimiz.html
    # MÜKERRER AĞAÇ — ÖLÇÜLDÜ VE KESİLDİ (2026-08-20, kampanya turu koşulduktan
    # SONRA ölçüldü, tahmin değil). tombankhadi.com aynı kampanyayı İKİ yoldan
    # yayımlıyor:
    #   /kampanyalar/<slug>                        → 82 belge
    #   /cok-kazananlar-kulubu-kampanya/<slug>     → 81 belge
    #   aynı slug'ın iki yolda birlikte bulunması  → 81
    #   YALNIZ cok-kazananlar'da bulunan slug      → 0   (SIFIR)
    # Yani ikinci ağaç tek bir özgün belge getirmiyor. `collect_live`in temiz
    # metin tekilleştirmesi bunları YAKALAYAMADI çünkü aradaki tek fark kırıntı
    # yolu: "Kampanyalar" ↔ "TOM Bank Çok Kazananlar Kulübü … Kampanya"
    # (ölçülen fark 56 bayt, gövde metni birebir aynı). Mükerrer belge
    # değerlendirme metriklerini çifte sayar ve çelişki sayısını şişirir
    # (collector.py'deki 2026-08-03 ölçümüyle aynı başarısızlık kipi).
    exclude_patterns:
      - /cok-kazananlar-kulubu-kampanya/
    # ÜRÜN BİLGİ FORMU HAVUZU — `document_paths` bugüne kadar TANIMSIZDI, bu
    # yüzden belge turu bu bankada hiç koşmadı (docs=0). Kanıt uydurma değil:
    # zaten toplanmış data/raw/tom-katilim/products/sozlesme-ve-formlar.html
    # içinde 96 tekil `.pdf` bağlantısı duruyor; canlı sayfa STATİK çekimle de
    # 99 tekil PDF bağlantısı veriyor (curl, HTTP 200). Bunlar arasında
    # "günlük kazandıran hesap bilgilendirme formu", "katılma hesabı ek
    # sözleşmesi", "icâre akdi müşteri bilgilendirme formu", "karz fon toplama
    # akdi" gibi KÂR PAYI / ÜCRET taşıyan formlar var (§18-2'nin tam hedefi).
    # `collect_documents` PDF'i her zaman `static` çekiciyle indirir, banka
    # `scrape_mode: js` olsa bile — bu yüzden statik ölçüm doğru ölçümdür.
    #
    # DENENDİ ve ALINMADI (0 statik PDF bağlantısı verdiği ölçüldü, HTTP 200):
    #   tombankhadi.com/ucretler-ve-limitler   → PDF yok (içerik JS ile geliyor)
    #   tombankhadi.com/sozlesme-ve-formlar    → PDF yok (aynı sebep)
    #   www.tombank.com.tr/urun-ve-hizmet-ucretleri.html → HTTP 404 (ölü yol)
    # Boş dönen yolu config'e yazmak istek üretir, belge üretmez.
    document_paths:
      - /sozlesme-ve-formlar.html
      - https://tombankhadi.com/urun-ve-hizmet-ucretleri
    # 100 ölçülmüş aday (99 + 1) + pay.
    max_document_docs: 110
    # 60 → 180: eşleşen aday 162 ölçüldü; 60'ta kalsa 100'den fazlası kırpılırdı.
    max_docs: 180

