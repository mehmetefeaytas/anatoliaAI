  # Adil Katılım — Nuxt/Vue tek-sayfa uygulaması: HTML kaynağında içerik yok,
  # sitemap de yok; yalnızca tarayıcı ile toplanabilir.
  # 2026-07-30 doğrulaması: sitede KAMPANYA KATALOĞU YOK. Tarayıcıyla gezilen
  # tüm bağlantılar kurumsal sayfalar (hakkımızda, KVKK, yatırımcı ilişkileri).
  # Banka henüz ürün/kampanya yayımlamıyor → düşük belge sayısı beklenen durumdur.
  - slug: adil-katilim
    name: Adil Katılım
    website_url: https://www.adilkatilim.com.tr
    scrape_mode: js
    # 2026-08-04: https://www.adilkatilim.com.tr (ana sayfa) HTTP 200 doğrulandı.
    # Bu, aşağıdaki "/" girdisinin ta kendisi (website_url + "/") — ayrı satır
    # olarak eklenmedi, aksi halde ana sayfa iki kez toplanırdı.
    campaign_paths:
      - /
      - /katilim-bankaciligi
      - /hakkimizda
    detail_patterns:
      - katilim-bankaciligi
      - adilkatilim.com.tr/$
      - kampanya
      - finansman
    # 2026-08-20 AİLE KAPSAMI turu (docs/rapor/aile-kapsami-hasadi.md).
    # `document_paths` bugüne kadar TANIMSIZDI → belge turu bu bankada hiç
    # koşmadı. Yol tahminle değil, ZATEN TOPLANMIŞ sayfadan bulundu:
    # data/raw/adil-katilim/live/katilim-bankaciligi-belgeler.html içinde
    # 9 tekil `/assets/pdfs/...` bağlantısı `<a href>` olarak duruyor
    # (4 bilgilendirme formu + 5 icâzet belgesi). Canlı sayfa STATİK çekimle
    # de 10 tekil PDF bağlantısı veriyor (curl, HTTP 200) — yani Nuxt/Vue
    # tek-sayfa uygulaması olmasına rağmen bu sayfanın bağlantıları sunucuda
    # render ediliyor ve `collect_documents`ın statik çekicisiyle erişilebilir.
    #   robots.txt: gövde BOŞ (1 bayt, HTTP 200) → kural yok.
    #   sitemap.xml: HTTP 200 ama XML DEĞİL — SPA ana sayfasının HTML'i
    #     dönüyor (<!DOCTYPE html>, <title>Anasayfa | Adil Katılım</title>).
    #     Bu yüzden `sitemap_urls` YAZILMADI: eklenirse `parse_sitemap` 0 <loc>
    #     bulup her koşuda boşuna bir istek üretirdi.
    #
    # KONUT / TAŞIT ÜRÜNÜ ARANDI — **YOK**. Kanıt bankanın kendi ürün
    # kataloğu (live/katilim-bankaciligi-urun-ve-hizmetler.txt): dört ürün
    # sayıyor — Özel Cari Hesap, Ticari Finansman, Katılma Hesapları,
    # Bireysel Finansman ("eğitim, sağlık, tatil, ev eşyası"). Konut ve taşıt
    # finansmanı hattı henüz açılmamış. Olmayan sayfa için yol yazılmadı.
    document_paths:
      - /katilim-bankaciligi/belgeler
    max_docs: 40

  # ---------------------------------------------------------------------------
  # TKBB — BANKA DEĞİL, OTORİTE KAYNAK. `banks:` listesinde durmasının tek
  # nedeni ingest yolunun (src/pipeline.py::run_pipeline) banka kayıtlarını
  # banks.yaml'dan sürmesi: burada olmayan bir `data/raw/<slug>/` klasörü
  # korpusa HİÇ girmez. Yani bu blok bir "banka tanımı" değil, bir KORPUS
  # KAYNAĞI tanımıdır.
  #
  # Neden eklendi (docs/rapor/musaraka-veri-boslugu.md): fıkhî terimlerin
  # TANIMI banka kampanya/ürün sayfalarında yok — bankalar terimi kullanır,
  # açıklamaz. Ölçüldü: korpusta müşarakayı tanımlayan tek belge yoktu, terim
  # yalnız 6 belgede ve hepsinde "geçerken anma" biçiminde geçiyordu.
  # TKBB'nin Katılım Finansı Standartları ve eğitim portalı bu tanımların
  # BİRİNCİL kaynağıdır.
  #
  # KIYAS TEHLİKESİ ve ÇÖZÜMÜ (CLAUDE.md §13, §17): süzme olmadan TKBB
  # `GET /banks` üzerinden "11. banka" olarak dönüyordu ve arayüzdeki banka
  # listesine düşüyordu. Jüri kıyas ekranında TKBB satırı görseydi bu doğrudan
  # bir kusur olurdu — §13 hedef listeyi BDDK Liste 77 ile tanımlar.
  #
  # Ayrım `otorite_kaynak: true` ile kurulur, `bddk_active` ile DEĞİL:
  #   bddk_active=false  -> gerçek banka, lisansı aktif değil (kıyasa girer)
  #   otorite_kaynak=true -> banka değil (katalogda ve kıyasta yeri yok)
  # İkisini tek alana yıkmak, lisansı düşmüş gerçek bir bankayı da katalogdan
  # silerdi. `GET /banks` otorite kaynaklarını süzer;
  # `?otorite_kaynaklari_dahil=true` tam listeyi verir (süzme ≠ gizleme).
  #
  # Kıyas tarafı ZATEN korunuyordu: `/compare` belge türüne göre süzülüyor ve
  # bu iki belgenin de `belge_turu='sozlesme'` (ölçüldü) — hiçbir zaman kıyas
  # satırı üretmediler.
  #
  # `scrape_mode: manual` → yalnız data/raw fixture'ından okunur; bu blok
  # otomatik gezinme (discover) TETİKLEMEZ. Belgeler hedefli ve elle seçilerek,
  # robots.txt doğrulanarak toplandı (ikisi de "Allow: /", kural yok).
  - slug: tkbb
    name: Türkiye Katılım Bankaları Birliği
    website_url: https://tkbb.org.tr
    bddk_active: false
    otorite_kaynak: true
    scrape_mode: manual
    campaign_paths: []
    max_docs: 40
