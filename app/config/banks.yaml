# Katılım bankaları — config-driven scraping kaynağı
# İlgili: ../../decisions/bddk-listesi-veri-kaynagi-kapsami.md
#         ../../entities/katilim-bankalari.md, CLAUDE.md §13
# Yeni banka eklemek = tek blok (yenilikçilik: config-driven onboarding).
# BDDK Liste 77 doğrulanmalı: https://www.bddk.org.tr/Kurulus/Liste/77
#
# scrape_mode: static (requests+bs4) | js (playwright) | manual (data/raw fixture)
#   -> src/scraping/fetcher.py FetcherBundle.for_mode() burada dispatch eder.
# campaign_paths : iki aşamalı gezinmenin BAŞLANGIÇ (liste) sayfaları
# sitemap_urls   : keşif için sitemap(.xml); sitemapindex özyinelemeli çözülür
# detail_patterns: keşfedilen URL'lerden kampanya detayını süzen regex'ler
# exclude_patterns: banka özelinde ek eleme (varsayılanlar discover.py'de)
# max_docs       : banka başına toplanacak azami belge
# archive_paths  : SÜRESİ DOLMUŞ kampanya listeleri (arşiv / "biten kampanyalar").
#                  Ayrı tur olarak toplanır → data/raw/<slug>/archive/, provenance'ta
#                  campaign_status=expired. `suresi_dolmus_kampanya` kuralı ve
#                  zaman-koşullu çelişki tespiti için GERÇEK etiket kaynağıdır.
# document_paths : ücret tarifesi / sözleşme-form sayfaları (PDF bağlantısı taşır)
# document_hosts : PDF'lerin durduğu ek alan adları (ör. asset.emlakkatilim.com.tr)
#
# 2026-07-30 doğrulaması: eski yollar (/kampanyalar) 8/10 bankada 404 dönüyordu;
# gerçek yollar sitemap + liste sayfası taraması ile düzeltildi.
#
# 2026-08-03 tarayıcı keşfi (docs/rapor/banka-siteleri-veri-kaynagi-haritasi.md):
#  * max_docs=40 kırpması gerçek kaybettiriyordu (kuveyt-turk: 475 aday → 39 belge)
#    → banka başına aday sayısına göre yükseltildi.
#  * Ziraat'in kampanya kataloğu /bireysel/kampanyalar'da DEĞİL: o sayfa boş
#    (7 bağlantı, hiçbiri detay değil). Gerçek katalog /kart-kampanyalari
#    (191 bağlantı) + 15 sektör kategorisi. Bu yüzden yalnızca 5 kampanya
#    toplanabilmişti.
#  * Ücret tarifeleri HTML tablo değil PDF; bazıları ayrı alan adında.
#
# 2026-08-04 URL doğrulaması (curl, HTTP 200 — tahmin DEĞİL):
#  * 20 URL denetlendi; 8'i gerçekten yeni, 12'si zaten dosyada mevcuttu ve
#    tekrar EKLENMEDİ (çift toplama = karşılaştırmada yapay tekrar).
#  * Yeni alan adları: saglamkart.kuveytturk.com.tr (ALT ALAN → `same_site()`
#    zaten tolere ediyor, `extra_hosts` gereksiz) ve hayatpay.com.tr (AYRI
#    KAYITLI ALAN → `extra_hosts` ZORUNLU, aksi halde tümüyle atlanır).
#  * Albaraka'nın `?slug=gecmis-kampanyalar` sayfası `archive_paths`a yazıldı;
#    `campaign_paths`a konsa süresi dolmuş kampanyalar aktif sanılırdı.
#  * Yol eklenen 3 bankada max_docs orantılı yükseltildi (aşağıda gerekçeli).

banks:
  - slug: kuveyt-turk
    name: Kuveyt Türk
    website_url: https://www.kuveytturk.com.tr
    # `js` DENENDİ ve ÖLÇÜLDÜ (2026-08-04) — bkz. vakif-katilim'daki not.
    # 21 "kabuk" şüphelisinin TAMAMI yanlış pozitifti: hepsi zaten gerçek
    # kampanya metni taşıyor (ör. kampanya-arsivi-kampusten-ucuran-firsat
    # 1182 krkt, tam koşul metniyle). Tarayıcı metni bayt-aynı çıktı.
    scrape_mode: static
    campaign_paths:
      - /kampanyalar
      - /kampanyalar/kendim-icin
      - /kampanyalar/isim-icin
      # 2026-08-04'te HTTP 200 doğrulandı (curl). Üçü de YENİ giriş noktası:
      #  * saglamkart.kuveytturk.com.tr KART ALT ALANI: Sağlam Kart kampanya
      #    kataloğu ana alanın /kampanyalar ağacında YOK, ayrı alt alanda
      #    yayımlanıyor. `extra_hosts`a EKLENMEDİ ÇÜNKÜ gerek yok: discover.py
      #    `_host()` "www." ekini atıyor (base → kuveytturk.com.tr), `same_site()`
      #    ise `a.endswith("." + b)` ile alt alanları zaten "aynı site" sayıyor
      #    → saglamkart.kuveytturk.com.tr toleranse ediliyor (ölçüldü: True).
      #    hayatpay.com.tr gibi AYRI kayıtlı alanlar için durum farklı, oraya bak.
      #  * /ozel-bankacilik/... özel bankacılık müşterilerine özel kampanyalar;
      #    kitlesel /kampanyalar listesinde görünmüyor (ayrı hedef kitle).
      #  * /isim-icin KOBİ/ticari segment merkezi — /kampanyalar/isim-icin'den
      #    FARKLI sayfa: kampanya listesi değil segment menüsü, ticari
      #    kampanyalara bağlantı taşıyor.
      # Üçü de `detail_patterns` ("/kampanyalar/") ile eşleşmediği için BELGE
      # olarak değil, yalnızca bağlantı toplanacak GEZİNME BAŞLANGICI olarak
      # sayılır — istenen davranış bu (liste sayfası içerik değil).
      - https://saglamkart.kuveytturk.com.tr/kampanyalar
      - /ozel-bankacilik/ayricaliklar/kampanyalar
      - /isim-icin
      # 2026-08-04 KART MARKASI turu (docs/rapor/devam-kart-markalari.md):
      # milesandsmiles.kuveytturk.com.tr Kuveyt Türk'ün Türk Hava Yolları ortak
      # markalı KART SİTESİ. saglamkart.* ile AYNI motorda ama AYRI katalog:
      # 9 kampanya detayı (`/kampanyalar/<slug>-<id>`), hiçbiri ana alanın
      # /kampanyalar ağacında YOK (ölçüm: mil kampanyaları yalnız burada).
      # `extra_hosts` GEREKSİZ — alt alan, `same_site()` zaten tolere ediyor.
      # robots.txt: "User-agent: * / Allow: /" (ölçüldü) → kısıt yok.
      # Statik hasat DOĞRULANDI: liste sayfasında 9/9 bağlantı statikte de
      # görünüyor (js ile bayt-aynı), 3 belge örneklendi → 935-1661 krkt,
      # üçü de FARKLI hash, TL/taksit/vade sinyali taşıyor.
      # `/kampanyalar/biten-kampanyalar` arşiv sayfası her iki kart alt
      # alanında da BOŞ (0 bağlantı, `?isArchived=true` ile de 0) → archive_paths'a
      # EKLENMEDİ; ayrıca DEFAULT_ARCHIVE_PATTERNS'teki "biten-kampanya" deseni
      # onu aktif turdan zaten eliyor, yani yanlış "aktif" etiketi riski yok.
      - https://milesandsmiles.kuveytturk.com.tr/kampanyalar
    # Arşiv listeleme sayfası her kampanyanın BİTİŞ TARİHİNİ ayrı düğümde veriyor
    # (ör. 31.07.2026) → başlık + bitiş tarihi + özet üçlüsü hazır etiket.
    archive_paths:
      - /kampanyalar/kampanya-arsivi
      - /kampanyalar/kampanya-arsivi?root=kendim-icin
      - /kampanyalar/kampanya-arsivi?root=isim-icin
    # 2026-08-03: /hesaplama-araclari'nda PDF yok; gerçek yollar site
    # haritasından doğrulandı.
    document_paths:
      - /urun-hizmet-ucretleri
      - /sozlesmeler
    # Arşivde 318 aday bulundu; 60 tavanı gerçek veri kaybettiriyordu.
    max_archive_docs: 200
    sitemap_urls:
      - https://www.kuveytturk.com.tr/sitemap.xml
    detail_patterns:
      - /kampanyalar/
      - kampanyasi
      - firsati
      - avantaji
    # 2026-08-04: giriş noktası sayısı 3 → 6'ya çıktı (kart alt alanı + özel
    # bankacılık + ticari segment). Tavan sabit kalsa yeni alanların belgeleri
    # kırpılıp atılırdı; aday havuzunun büyük kısmı hâlâ sitemap'ten geldiği için
    # 2 kat değil ~%25 artış yeterli: 260 → 320.
    #
    # 2026-08-04 (kart markası turu): milesandsmiles alt alanı 9 ÖLÇÜLMÜŞ yeni
    # aday getiriyor, saglamkart 10. İkisi de ana alanın sitemap'inde YOK
    # (ayrı alan → sitemap ayrı), yani havuza tam 19 belge ekliyorlar. Tavan
    # 320'de kalsa sitemap adayları bu 19'u kenara itebilirdi → 340.
    max_docs: 340

  - slug: albaraka
    name: Albaraka Türk
    website_url: https://www.albaraka.com.tr
    scrape_mode: static
    campaign_paths:
      - /tr/kampanyalar
      # 2026-08-04'te HTTP 200 doğrulandı (curl). Dördü de SEGMENT MERKEZİ:
      # /tr/kampanyalar yalnızca bireysel kitleye açık kampanyaları listeliyor;
      # KOBİ, ticari-kurumsal ve dijital bankacılık kampanyaları kendi segment
      # sayfalarından bağlanıyor, ana listede görünmüyor. /tr/bireysel/
      # finansmanlar/ihtiyac ise ihtiyaç finansmanı kampanyalarının bağlandığı
      # ürün merkezi (CLAUDE.md §6: oran/vade bilgisi ürün sayfasında durur).
      # Bu dördü `detail_patterns` ("/tr/kampanyalar/") ile eşleşmediği için
      # BELGE olarak sayılmaz, yalnızca bağlantı hasadı için giriş noktasıdır.
      - /tr/kobi
      - /tr/ticari-ve-kurumsal
      - /tr/dijital-bankacilik
      - /tr/bireysel/finansmanlar/ihtiyac
      # 2026-08-04 KART MARKASI turu (docs/rapor/devam-kart-markalari.md).
      # KANIT TAHMİN DEĞİL: zaten toplanmış data/raw/albaraka/live/tr-kampanyalar.html
      # içinde "Worldcard Kampanyaları" düğmesi var →
      #   <a href="https://www.albarakaworldcard.com/kampanyalarimiz">
      # albarakaworldcard.com AYRI SİTE DEĞİL: 301'le
      # www.albaraka.com.tr/tr/world-dunyasi/kampanyalar'a düşüyor (ölçüldü).
      # Bu yüzden `extra_hosts`a YAZILMADI — aynı alan, gereksiz olurdu.
      # Kayıp GERÇEKTİ: bu ağaç ne campaign_paths'ta ne de detail_patterns'ta
      # ("/tr/kampanyalar/") eşleşiyordu → 37 kampanya detayı
      # (`/tr/world-dunyasi/detay/...`) hiç toplanmamıştı (korpusta 0 belge, ölçüldü).
      - /tr/world-dunyasi/kampanyalar
      # albarakaozel.com AYRI KAYITLI ALAN (Albaraka Özel Bankacılık) — aşağıdaki
      # `extra_hosts` girdisi ZORUNLU, aksi halde `same_site()` False döner ve
      # sayfayla birlikte ondan çıkan tüm bağlantılar atılır.
      # 11 ayrıcalık detayı (`/tr/ayricalik/<slug>-<id>`) taşıyor; bunlar özel
      # bankacılık KARTI avantajları (indirim oranı + taksit + TL tavanı), yani
      # kampanya sınıfı içerik. robots.txt: "User-agent: * / Allow: /" (ölçüldü).
      - https://www.albarakaozel.com/tr/ayricaliklar
    # 2026-08-04'te HTTP 200 doğrulandı (curl). `campaign_paths`a DEĞİL buraya
    # yazıldı: bu sayfa SÜRESİ DOLMUŞ kampanyaların listesi. campaign_paths'a
    # konsa `live/` altına düşer ve karşılaştırma motoru bitmiş kampanyayı AKTİF
    # sanardı (CLAUDE.md §17 adil-kıyas ihlali). archive_paths ise `archive/`
    # alt dizinine yazıp provenance'a campaign_status=expired koyar; bu
    # `suresi_dolmus_kampanya` kuralının GERÇEK etiket kaynağıdır.
    # Not: `?slug=gecmis-kampanyalar` sorgusu discover.py normalize_url()
    # tarafından korunuyor ve DEFAULT_ARCHIVE_PATTERNS'teki "gecmis-kampanya"
    # deseniyle eşleşiyor → ayrı `archive_patterns` tanımlamaya gerek yok.
    # max_archive_docs varsayılan 60'ta bırakıldı: Kuveyt Türk'te olduğu gibi
    # ölçülmüş bir aday sayısı yok, tahminle tavan yükseltmiyoruz.
    archive_paths:
      - /tr/kampanyalar?slug=gecmis-kampanyalar
    # 2026-08-03: tahmin edilen yollar 404 döndü; gerçekleri ana sayfadan alındı.
    document_paths:
      - /tr/urun-ve-hizmet-ucretleri
      - /tr/hakkimizda/iletisim/sozlesme-ve-formlar
    extra_hosts:
      - albarakaozel.com
    sitemap_urls:
      - https://www.albaraka.com.tr/sitemap.xml
    detail_patterns:
      - /tr/kampanyalar/
      # 2026-08-04: iki YENİ belge deseni. Bunlar olmadan yukarıdaki iki giriş
      # noktası yalnızca "gezinme başlangıcı" sayılır ve bulunan 48 detay sayfası
      # BELGE olarak kaydedilmez — yani yol eklemek tek başına yetmiyordu.
      - /tr/world-dunyasi/detay/
      - /tr/ayricalik/
    # 2026-08-04: giriş noktası 1 → 5 oldu. 5 kat artırmıyoruz çünkü yalnızca
    # `/tr/kampanyalar/` desenine uyan bağlantılar belge sayılıyor; segment
    # sayfalarının kendisi sayılmıyor. Gerçekçi beklenti ~2 kat: 60 → 120.
    #
    # 2026-08-04 (kart markası turu): ÖLÇÜLEN yeni aday sayısı 48
    # (37 world-dunyasi/detay + 11 albarakaozel/tr/ayricalik). Tavan 120'de
    # kalsa `/tr/kampanyalar/` adaylarıyla aynı havuzu paylaşıp kırpılırlardı.
    # 120 + 48 = 168 → yuvarlanarak 180 (arşiv turu ayrı tavanda, etkilenmez).
    max_docs: 180

  - slug: turkiye-finans
    name: Türkiye Finans
    website_url: https://www.turkiyefinans.com.tr
    # `static` → `js` (2026-08-04, KART MARKASI turu). Bu değişiklik ÖLÇÜMLE
    # gerekçelendirildi; diğer bankalarda `js` KASITLI olarak reddedildi (bkz.
    # vakif-katilim notu: 98/101 sayfada tarayıcı metni statikle bayt-aynıydı).
    # Türkiye Finans'ta durum FARKLI çıktı, iki bağımsız sebeple:
    #
    #  1) ZORUNLU SEBEP — happycard.com.tr'ye `static` ile ULAŞILAMIYOR.
    #     Sunucu TLS el sıkışmasında YALNIZCA yaprak sertifikayı gönderiyor,
    #     ara sertifikayı (DigiCert Global G2 TLS RSA SHA256 2020 CA1) göndermiyor:
    #       openssl → "Verify return code: 21 (unable to verify the first certificate)"
    #     `curl` (macOS anahtar zinciri, AIA ile ara sertifikayı kendi çekiyor) ve
    #     Playwright başarılı; `requests`+certifi ise
    #       SSLError: CERTIFICATE_VERIFY_FAILED unable to get local issuer certificate
    #     ile DÜŞÜYOR (ölçüldü). StaticFetcher bunu `blocked`a yazıp sessizce
    #     geçerdi → 9 kampanya belgesi hiç toplanmazdı. `verify=False` YAPILMADI:
    #     doğrulamayı kapatmak tüm alanlar için güvenlik gerilemesi olurdu ve
    #     fetcher.py bu turun kapsamı dışında.
    #
    #  2) DESTEKLEYİCİ ÖLÇÜM — `js` ana sitede de KAYIP VERMİYOR, hatta kazandırıyor:
    #     /kampanyalar/Sayfalar/default.aspx      static 11 bağlantı → js 12
    #     /kampanyalar/Sayfalar/kart-kampanyalari static 12 bağlantı → js 14
    #     Hiçbir sayfada statik-fazlası bağlantı YOK (staticFazla=0). js-only
    #     bulunanlar gerçek: kobi-kampanyalari.aspx, ...mobilden-tanis.aspx.
    #     Metin de artıyor (6506→8163 krkt) çünkü liste kartları geç yükleniyor.
    #     Ayrıca `js` `fetch_all_pages`i etkinleştiriyor; TF liste sayfalarında
    #     sayfalama widget'ı yok (ölçüldü: sayfa=1) → yan etki üretmiyor,
    #     biten-kampanyalar.aspx'te 21 arşiv bağlantısı görüyor.
    #
    # BEDEL: hasat yavaşlıyor. Kabul edildi çünkü alternatif SESSİZ VERİ KAYBI.
    scrape_mode: js
    # 2026-08-04 doğrulaması: /tr-tr/kampanyalar/sayfalar/default.aspx HTTP 200
    # döndü, ancak bu aşağıdaki ilk satırın YALNIZCA KÜÇÜK HARFLİ biçimi.
    # SharePoint yollarında büyük/küçük harf farkı aynı sayfayı verir; ayrı satır
    # olarak eklenirse discover.py `seen` kümesi iki farklı dizge görüp AYNI
    # sayfayı İKİ KEZ toplar (çift kayıt → karşılaştırmada yapay tekrar).
    # Bu yüzden tekrar eklenmedi.
    campaign_paths:
      - /tr-tr/kampanyalar/Sayfalar/default.aspx
      - /tr-tr/kampanyalar/Sayfalar/finansman-kampanyalari.aspx
      - /tr-tr/kampanyalar/Sayfalar/kart-kampanyalari.aspx
      - /tr-tr/kampanyalar/Sayfalar/dijital-bankacilik-kampanyalari.aspx
      - /tr-tr/kampanyalar/Sayfalar/birikim-fon-kampanyalari.aspx
      - /tr-tr/kampanyalar/Sayfalar/odeme-kampanyalari.aspx
      - /tr-tr/kampanyalar/Sayfalar/yatirim-kampanyalari.aspx
      - /tr-tr/kampanyalar/Sayfalar/ticari-kampanyalar.aspx
      - /tr-tr/kampanyalar/Sayfalar/sigorta-kampanyalari.aspx
      - /tr-tr/kampanyalar/Sayfalar/diger-kampanyalar.aspx
      # 2026-08-04 KART MARKASI turu (docs/rapor/devam-kart-markalari.md).
      # happycard.com.tr = Türkiye Finans'ın Happy Kart markası. Alan adı TAHMİN
      # EDİLMEDİ: bankanın kendi kredi kartları sayfası
      # (/tr-tr/bireysel/Sayfalar/kredi-kartlari.aspx) Happy Silver/Gold/Platinum
      # bağlantılarını doğrudan www.happycard.com.tr'ye veriyor (tarayıcıyla ölçüldü).
      # 10 kampanya detayı (`/kampanyalar/Sayfalar/*.aspx`), 9'u ana sitenin
      # kampanya ağacında YOK → gerçek kayıp kaynak.
      # ÖNEMLİ: çıplak alan adı 404 veriyor, `www.` ZORUNLU (ölçüldü). Yine de
      # `extra_hosts`a "happycard.com.tr" yazıldı çünkü discover.py `_host()`
      # "www." ekini atarak karşılaştırıyor.
      # robots.txt YOK (404 → SharePoint hata sayfasına düşüyor), sitemap.xml da yok;
      # bu yüzden keşif YALNIZCA aşağıdaki liste sayfasından yürüyor.
      # Kabuk/tekrar tuzağı kontrol EDİLDİ: 10 sayfa hasat edildi, 10 FARKLI hash,
      # 2346-4630 krkt, hepsinde TL/taksit/kâr payı sinyali → liste metni her
      # sayfaya kopyalanmıyor.
      - https://www.happycard.com.tr/kampanyalar/Sayfalar/default.aspx
    # happycard.com.tr AYRI KAYITLI ALAN (alt alan değil): `same_site()` testi
    # happycard.com.tr ↔ turkiyefinans.com.tr için False döner, yani bu satır
    # olmadan sayfa da ondan çıkan tüm bağlantılar da atılırdı.
    extra_hosts:
      - happycard.com.tr
    # DOSYA ADI ÇAKIŞMASI — ÖLÇÜLDÜ ve KORPUSU BOZDU (2026-08-04, onarıldı).
    # `collector.url_to_slug` yalnızca yolun son parçalarını kullandığı için
    #   www.turkiyefinans.com.tr/tr-tr/kampanyalar/Sayfalar/default.aspx
    #   www.happycard.com.tr/kampanyalar/Sayfalar/default.aspx
    # İKİSİ DE `kampanyalar-default` slug'ına düşüyor. Ayrı bir hasat çağrısında
    # happycard'ın liste sayfası (2777 krkt) Türkiye Finans'ın ANA kampanya
    # listesini (6506 krkt) sessizce EZDİ — `.meta.json`daki `source_url` bile
    # happycard'a döndü. (`save_docs` çakışmayı yalnızca AYNI çağrı içinde
    # `-2` ekiyle çözüyor; çağrılar arasında üzerine yazıyor.)
    # Çözüm: happycard'ın LİSTE sayfası BELGE olarak sayılmasın. Kayıp yok —
    # `_discover` bu yolu `campaign_paths` girişi olarak GEZMEYE devam ediyor
    # (`_listing_pages` exclude'a bakmaz), yalnızca `add()` onu belge listesine
    # koymuyor; 9 kampanya DETAYI eksiksiz toplanıyor ve liste sayfasının kendi
    # metni zaten yalnızca kampanya başlıklarından oluşuyordu.
    exclude_patterns:
      - happycard\.com\.tr/kampanyalar/Sayfalar/default\.aspx
    # Türkiye Finans süresi dolmuş kampanyaları AYRI sayfada yayımlıyor.
    archive_paths:
      - /tr-tr/kampanyalar/Sayfalar/biten-kampanyalar.aspx
    document_paths:
      - /tr-tr/bireysel/Sayfalar/urun-hizmet-ucretleri.aspx
      - /tr-tr/sozlesmeler-ve-formlar/Sayfalar/sozlesmeler-ve-formlar.aspx
      - /tr-tr/bireysel/sozlesmeler-ve-formlar/Sayfalar/default.aspx
    detail_patterns:
      - /tr-tr/kampanyalar/Sayfalar/
      # happycard.com.tr'de yol öneki "/tr-tr" YOK: /kampanyalar/Sayfalar/x.aspx.
      # Bu desen ONU da ana sitenin /tr-tr/kampanyalar/Sayfalar/'ını da kapsar
      # (üstteki satırın üst kümesi); üstteki satır silinmedi, niyeti belgeliyor.
      # Eşleşme re.I ile yapıldığı için "Sayfalar" büyük harfi sorun değil.
      - /kampanyalar/Sayfalar/
      - finansmani.aspx
