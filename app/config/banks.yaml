    # hayatpay.com.tr AYRI KAYITLI ALAN (alt alan değil): `same_site()` testi
    # hayatpay.com.tr ↔ hayatfinans.com.tr için False döner (ölçüldü), yani
    # `extra_hosts`a yazılmasa keşif katmanı bu alanı "site dışı" sayıp
    # kampanya sayfasını ve ondan çıkan TÜM bağlantıları atardı.
    # Kuveyt Türk'ün saglamkart.* durumundan farkı budur: orası ALT ALAN olduğu
    # için `a.endswith("." + b)` kuralıyla zaten tolere ediliyor.
    extra_hosts:
      - hayatpay.com.tr
    document_paths:
      - /urun-ve-hizmet-ucretleri
      - /sozlesme-ve-formlar
      # 2026-08-20: getmedia bağlantısı TAŞIYAN diğer sayfalar (ölçüldü,
      # zaten diskteki HTML'lerden sayıldı): /sozlesme-ve-formlar 8 bağlantı,
      # aşağıdaki ikisi 1'er tane. `/urun-ve-hizmet-ucretleri` 0 veriyor ama
      # yol silinmedi: sayfa ücret tarifesinin kanonik adresi, ilerde PDF
      # eklenirse otomatik yakalanır.
      - /finansmanlar/bana-bunu-al-is-ortagim
      - /krediler/hayat-finans-egitim-finansmani-sistemi
      # hayatpay.com.tr/sozlesmeler → 5 tekil `.pdf` bağlantısı (curl, HTTP 200,
      # statik gövdede). `extra_hosts` zaten hayatpay.com.tr'yi "aynı site"
      # sayıyor, bu yüzden `document_hosts` GEREKMİYOR.
      # DENENDİ ve ALINMADI: hayatpay.com.tr/islemler-ve-ucretler 0 PDF veriyor —
      # ücret tablosu HTML olarak yayımlanıyor, o yüzden aşağıda `detail_patterns`
      # ile KAMPANYA turuna alındı, belge turuna değil.
      - https://hayatpay.com.tr/sozlesmeler
    # BELGE TURU BU BANKADA NİÇİN 0 DÖNÜYORDU (2026-08-20, kök neden bulundu).
    # `document_paths` tanımlıydı ama tur 0 PDF getiriyordu. Sebep tavan DEĞİL,
    # DESEN: `DEFAULT_DOCUMENT_PATTERNS` yalnız `\.pdf(\?|$)` arıyor, Hayat
    # Finans ise belgeleri UZANTISIZ yayımlıyor:
    #   https://hayatfinans.com.tr/getmedia/<guid>/<baslik>
    # Ölçüldü (curl -I): HTTP 200, `content-type: application/pdf`; indirilen
    # gövde `%PDF-1.4` ile başlıyor (91 KB). Yani gerçek PDF, yalnız adı .pdf
    # değil. `looks_like_pdf` içerik-tipi + imzaya baktığı için indirme tarafı
    # zaten çalışıyor; kırılan tek yer KEŞİF süzgeciydi.
    # `\.pdf` deseni SİLİNMEDİ — bu alan varsayılanı EZER, silinse .pdf uzantılı
    # belgeler bu bankada bir daha hiç bulunmazdı.
    # Diskteki HTML'lerde 11 tekil getmedia belgesi sayıldı; aralarında
    # "sözleşme öncesi bilgilendirme ile ÜCRET VE MASRAFLARA ilişkin
    # bilgilendirme formu" ve "bana-bunu-al-finansman-IHTIYAC-FINANSMANI
    # sözleşmesi" var — ihtiyaç finansmanı ailesinin tek birincil kaynağı.
    # robots.txt: "User-agent: * / Allow: /" (ölçüldü) → kısıt yok.
    document_patterns:
      - '\.pdf(\?|$)'
      - /getmedia/
    sitemap_urls:
      - https://www.hayatfinans.com.tr/sitemap.xml
      # DENENDİ, KOŞULDU ve GERİ ALINDI — hayatpay.com.tr/sitemap.xml (2026-08-20).
      # robots.txt onu bildiriyor, HTTP 200 dönüyor ve 36 <loc> içeriyor; 24'ü
      # `/kampanya/<sayi>` biçiminde ve ana bankanın sitemap'inde yok. Umut verici
      # göründü, EKLENDİ ve HASAT KOŞULDU. Sonuç ölçüldü: **24/24 sayısal adres
      # HTTP 404** (tam liste `docs/rapor/aile-kapsami-hasadi.md` ölü URL
      # bölümünde). Sitemap BAYAT. Kayıp yok: aynı kampanyalar liste sayfasından
      # SLUG'la geliyor ve `/kampanya/` deseniyle zaten toplanıyor (11 belge
      # ölçüldü). Sitemap kalsa her koşuda 24 boşa istek + 24 sahte "başarısız
      # URL" üretirdi — rapor kirlenir, sağlayıcıya boşuna yük binerdi.
      # TEKRAR EKLEMEYİN.
    detail_patterns:
      - /kampanyalar
      - /isim-kampanyalar
      # 2026-08-20: hayatpay.com.tr kampanya yolunu TEKİL yazıyor (`/kampanya/`),
      # ana banka ÇOĞUL (`/kampanyalar/`). Üstteki desen "/kampanyalar" olduğu
      # için hayatpay'in 11 kampanya detayı ELENİYORDU → `extra_hosts` doğru
      # tanımlı olmasına rağmen bu alandan korpusa TEK belge girmemişti (ölçüldü:
      # data/raw/hayat-finans altında hayatpay kaynaklı 0 belge).
      # Sondaki '/' ZORUNLU: '/kampanya' yazılsa '/kampanyalar/...' ile de
      # eşleşir ve niyet belirsizleşirdi.
      - /kampanya/
      # hayatpay ücret tarifesi HTML tablo olarak yayımlanıyor (PDF yok, ölçüldü)
      # → belge turu yerine kampanya turunda içerik olarak toplanıyor.
      - islemler-ve-ucretler
      - /finansmanlar/
    # 2026-08-04: ikinci bir kampanya kataloğu (hayatpay) eklendi; 40 tavanı iki
    # alanın belgelerini tek havuzda paylaştırıp ana bankanınkileri kırpardı.
    # Giriş noktası 1 → 2, tavan da 2 kat: 40 → 80.
    max_docs: 80

