    # 2026-08-20 AİLE KAPSAMI turu — tavan DEĞİŞTİRİLMEDİ, ölçüm nedeni:
    #   /urun-hizmet-ve-ucretleri → 2 PDF bağlantısı (ikisi de korpusta VAR)
    #   /sozlesme-ve-formlar      → 0 PDF bağlantısı (statik, 506 KB gövde;
    #     107 href'in hiçbiri belge değil — liste JS ile üretiliyor)
    # `collect_documents` PDF keşfini TASARIMI GEREĞİ statik çekiciyle yapıyor,
    # bu yüzden bu sayfa config'le kurtarılamaz. Yol silinmedi (kanonik adres).
    # Bu, kod tarafında ayrı bir karar konusudur; bu turda dokunulmadı.
    # robots.txt: "Allow: /" + "Disallow: *search=" → belge yolları serbest.
    # robots.txt'in bildirdiği sitemap (dunyakatilimsite.blueprint.com.tr)
    # HTTP 403 dönüyor; aşağıdaki kanonik sitemap 474 <loc> ile çalışıyor.
    sitemap_urls:
