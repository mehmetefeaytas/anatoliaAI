<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <rect width="900" height="330" fill="#f8fafc" rx="6"/>
  <text x="24" y="30" font-size="16" font-weight="700" fill="#1a1d23">Hangi katman kaç alan üretti? — teslim edilen korpusun gerçeği</text>
    <text x="236" y="94" font-size="12" font-weight="600" fill="#1a1d23" text-anchor="end">kural (regex + normalizasyon)</text>  <rect x="250" y="78" width="470" height="24" fill="#e5e7eb" rx="3"/>  <rect x="250" y="78" width="470.0" height="24" fill="#15803d" rx="3"/>  <text x="262" y="95" font-size="12" font-weight="700" fill="#fff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">2204 alan  (100%)</text>  <text x="250" y="118" font-size="10" fill="#6b7280">src/extraction/rules/ — deterministik, birincil</text>  <text x="236" y="156" font-size="12" font-weight="600" fill="#1a1d23" text-anchor="end">ner (BERTurk / GLiNER)</text>  <rect x="250" y="140" width="470" height="24" fill="#e5e7eb" rx="3"/>  <text x="262" y="157" font-size="12" font-weight="700" fill="#6b7280" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">0 alan  (0%)</text>  <text x="250" y="180" font-size="10" fill="#6b7280">yalnız kampanya türü sınıflandırmasında; alan üretmiyor</text>  <text x="236" y="218" font-size="12" font-weight="600" fill="#1a1d23" text-anchor="end">llm (kısıtlı JSON decoding)</text>  <rect x="250" y="202" width="470" height="24" fill="#e5e7eb" rx="3"/>  <text x="262" y="219" font-size="12" font-weight="700" fill="#b45309" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">0 alan  (0%)</text>  <text x="250" y="242" font-size="10" fill="#6b7280">LLM_BACKEND boş → NullLLMExtractor; hiç alan katmadı</text>  <rect x="24" y="256" width="852" height="44" fill="#fff" stroke="#b45309" rx="5"/>  <text x="38" y="274" font-size="11" font-weight="700" fill="#b45309">DÜRÜSTLÜK NOTU — mimari "hibrit", teslim edilen korpus %100 kural katmanı.</text>  <text x="38" y="290" font-size="10.5" fill="#1a1d23">LLM kolu kodda tamamdır ve canlı çıkarımda çağrılabilir; ancak GPU olmadığı için korpus üretiminde hiç devreye girmedi. Ablasyon henüz koşulmadı.</text>
  <text x="24" y="318" font-size="10" fill="#6b7280" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">kaynak: data/demo.db · SELECT extractor, COUNT(*) FROM extracted_fields</text>
</svg>
