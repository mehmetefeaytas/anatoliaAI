<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <rect width="900" height="300" fill="#f8fafc" rx="6"/>
  <text x="24" y="30" font-size="16" font-weight="700" fill="#1a1d23">On-prem kurulum ayak izi — dört profil</text>
    <text x="236" y="78" font-size="11.5" font-weight="600" fill="#1a1d23" text-anchor="end">Teslim imajı (api)</text>  <rect x="250" y="62" width="4.4" height="22" fill="#15803d" rx="3"/>  <text x="263.4" y="78" font-size="11.5" font-weight="700" fill="#1a1d23" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">96.5 MB</text>  <text x="250" y="98" font-size="9.5" fill="#6b7280">ölçüldü · 101.218.586 bayt</text>  <text x="236" y="128" font-size="11.5" font-weight="600" fill="#1a1d23" text-anchor="end">api + postgres (asgari)</text>  <rect x="250" y="112" width="11.5" height="22" fill="#15803d" rx="3"/>  <text x="270.5" y="128" font-size="11.5" font-weight="700" fill="#1a1d23" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">255.0 MB</text>  <text x="250" y="148" font-size="9.5" fill="#6b7280">ölçüldü · jüri demosu bu profille koşar</text>  <text x="236" y="178" font-size="11.5" font-weight="600" fill="#1a1d23" text-anchor="end">+ ollama (CPU yedeği)</text>  <rect x="250" y="162" width="137.1" height="22" fill="#b45309" rx="3"/>  <text x="396.1" y="178" font-size="11.5" font-weight="700" fill="#1a1d23" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">3.0 GB</text>  <text x="250" y="198" font-size="9.5" fill="#6b7280">digest pinli imaj</text>  <text x="236" y="228" font-size="11.5" font-weight="600" fill="#1a1d23" text-anchor="end">Tam GPU yığını (vLLM)</text>  <rect x="250" y="212" width="480.0" height="22" fill="#b91c1c" rx="3"/>  <text x="739.0" y="228" font-size="11.5" font-weight="700" fill="#1a1d23" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">10.4 GB</text>  <text x="250" y="248" font-size="9.5" fill="#6b7280">+ model ağırlıkları &gt;16 GB</text>  <text x="24" y="256" font-size="11" font-weight="700" fill="#0f766e">255 MB ↔ 10,6 GB = 40× fark. Kurum içi kurulumun gerçek maliyeti bu iki uç arasında seçilir.</text>  <text x="24" y="272" font-size="10.5" fill="#1a1d23">Jüri demosu asgari profille koşar: GPU yok, ağ yok, LLM kapalı — yine de 849 belge ve 5 karşılaştırma ölçütü çalışır.</text>
  <text x="24" y="288" font-size="10" fill="#6b7280" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">kaynak: app/docs/kaynak-tuketimi.md §6 + docker-compose.yml digest pinleri</text>
</svg>
