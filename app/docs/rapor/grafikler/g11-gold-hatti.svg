<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <rect width="900" height="300" fill="#f8fafc" rx="6"/>
  <text x="24" y="30" font-size="16" font-weight="700" fill="#1a1d23">Gold anotasyon hattı — kurulu ama koşulmamış</text>
    <rect x="24" y="60" width="116" height="118" rx="6" fill="#fff" stroke="#15803d" stroke-width="1.6"/>  <rect x="24" y="60" width="116" height="4" rx="2" fill="#15803d"/>  <text x="82.0" y="82" font-size="9.5" font-weight="700" fill="#1a1d23" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">preannotate.py</text>  <text x="82.0" y="102" font-size="8.5" fill="#6b7280" text-anchor="middle">849 belgeden 250 örnek</text>  <text x="82.0" y="114" font-size="8.5" fill="#6b7280" text-anchor="middle">hibrit çıkarımla ön-anotasyon</text>  <text x="82.0" y="166" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">✓ hazır</text>  <path d="M141 119.0 L146 119.0" stroke="#6b7280" stroke-width="1.3"/>  <rect x="148" y="60" width="116" height="118" rx="6" fill="#fff" stroke="#15803d" stroke-width="1.6"/>  <rect x="148" y="60" width="116" height="4" rx="2" fill="#15803d"/>  <text x="206.0" y="82" font-size="9.5" font-weight="700" fill="#1a1d23" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">to_review_csv.py</text>  <text x="206.0" y="102" font-size="8.5" fill="#6b7280" text-anchor="middle">alan-başına-satır CSV</text>  <text x="206.0" y="114" font-size="8.5" fill="#6b7280" text-anchor="middle">+50 mükerrer +20 kalibrasyon</text>  <text x="206.0" y="166" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">✓ hazır</text>  <path d="M265 119.0 L270 119.0" stroke="#6b7280" stroke-width="1.3"/>  <rect x="272" y="60" width="116" height="118" rx="6" fill="#fff" stroke="#b91c1c" stroke-width="1.6"/>  <rect x="272" y="60" width="116" height="4" rx="2" fill="#b91c1c"/>  <text x="330.0" y="82" font-size="9.5" font-weight="700" fill="#1a1d23" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">4 anotatör</text>  <text x="330.0" y="102" font-size="8.5" fill="#6b7280" text-anchor="middle">~1,5 sa/kişi · boş hücre</text>  <text x="330.0" y="114" font-size="8.5" fill="#6b7280" text-anchor="middle">= 'model doğru'</text>  <text x="330.0" y="166" font-size="9.5" font-weight="700" fill="#b91c1c" text-anchor="middle">⏳ YAPILMADI</text>  <path d="M389 119.0 L394 119.0" stroke="#6b7280" stroke-width="1.3"/>  <rect x="396" y="60" width="116" height="118" rx="6" fill="#fff" stroke="#b91c1c" stroke-width="1.6"/>  <rect x="396" y="60" width="116" height="4" rx="2" fill="#b91c1c"/>  <text x="454.0" y="82" font-size="9.5" font-weight="700" fill="#1a1d23" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">report_iaa.py</text>  <text x="454.0" y="102" font-size="8.5" fill="#6b7280" text-anchor="middle">Cohen κ (2) / Fleiss κ (4)</text>  <text x="454.0" y="114" font-size="8.5" fill="#6b7280" text-anchor="middle">eşik: κ≥0,80 kabul</text>  <text x="454.0" y="166" font-size="9.5" font-weight="700" fill="#b91c1c" text-anchor="middle">⏳ YAPILMADI</text>  <path d="M513 119.0 L518 119.0" stroke="#6b7280" stroke-width="1.3"/>  <rect x="520" y="60" width="116" height="118" rx="6" fill="#fff" stroke="#b91c1c" stroke-width="1.6"/>  <rect x="520" y="60" width="116" height="4" rx="2" fill="#b91c1c"/>  <text x="578.0" y="82" font-size="9.5" font-weight="700" fill="#1a1d23" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">build_gold.py</text>  <text x="578.0" y="102" font-size="8.5" fill="#6b7280" text-anchor="middle">gold.v1.json + sha256</text>  <text x="578.0" y="114" font-size="8.5" fill="#6b7280" text-anchor="middle">absent_fields ayrımı</text>  <text x="578.0" y="166" font-size="9.5" font-weight="700" fill="#b91c1c" text-anchor="middle">⏳ YAPILMADI</text>  <path d="M637 119.0 L642 119.0" stroke="#6b7280" stroke-width="1.3"/>  <rect x="644" y="60" width="116" height="118" rx="6" fill="#fff" stroke="#b45309" stroke-width="1.6"/>  <rect x="644" y="60" width="116" height="4" rx="2" fill="#b45309"/>  <text x="702.0" y="82" font-size="9.5" font-weight="700" fill="#1a1d23" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">split_gold.py</text>  <text x="702.0" y="102" font-size="8.5" fill="#6b7280" text-anchor="middle">dev/test bölmesi</text>  <text x="702.0" y="114" font-size="8.5" fill="#6b7280" text-anchor="middle">TEST dondurulur</text>  <text x="702.0" y="166" font-size="9.5" font-weight="700" fill="#b45309" text-anchor="middle">✓ protokol hazır</text>  <path d="M761 119.0 L766 119.0" stroke="#6b7280" stroke-width="1.3"/>  <rect x="768" y="60" width="116" height="118" rx="6" fill="#fff" stroke="#b91c1c" stroke-width="1.6"/>  <rect x="768" y="60" width="116" height="4" rx="2" fill="#b91c1c"/>  <text x="826.0" y="82" font-size="9.5" font-weight="700" fill="#1a1d23" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">run_eval + ablation</text>  <text x="826.0" y="102" font-size="8.5" fill="#6b7280" text-anchor="middle">P/R/F1 + bootstrap GA</text>  <text x="826.0" y="114" font-size="8.5" fill="#6b7280" text-anchor="middle">+ McNemar · 4 kol</text>  <text x="826.0" y="166" font-size="9.5" font-weight="700" fill="#b91c1c" text-anchor="middle">⏳ %30 BURADA</text>  <rect x="24" y="216" width="852" height="54" fill="#fff" stroke="#b91c1c" rx="5"/>  <text x="38" y="235" font-size="11" font-weight="700" fill="#b91c1c">Hattın 3406 satırı yazılmış ve test edilmiş; 3. adımdan itibaren hiç koşulmamış.</text>  <text x="38" y="251" font-size="10.5" fill="#1a1d23">Kural katmanı gold sete BAKILMADAN yazıldı → 250 kayıt gerçek bir held-out test setidir. Bu avantaj yalnız gold</text>  <text x="38" y="265" font-size="10.5" fill="#1a1d23">dondurulup metrik ondan sonra üretilirse korunur. 23 gün içinde kapatılması gereken tek kritik boşluk budur.</text>
  <text x="24" y="288" font-size="10" fill="#6b7280" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">kaynak: app/scripts/{preannotate,to_review_csv,report_iaa,build_gold,split_gold}.py</text>
</svg>
