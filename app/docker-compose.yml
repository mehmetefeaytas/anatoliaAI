# Anatolia AI — tek komutla offline, API anahtarsız ayağa kalkar.
# İlgili: ../decisions/on-premise-calistirilabilir-mimari.md, CLAUDE.md §7, §20
#         docs/OFFLINE-KANIT.md (ölçülmüş `--network none` kanıtı + digest tablosu)
# Kullanım:  docker-compose up
# LLM: vllm (GPU) birincil; gpu yoksa ollama profili (`--profile ollama`).
#
# ## NEDEN DIGEST PIN (`@sha256:...`)
#
# Bu dosya daha önce üç imajı da hareketli etiketle (`:pg16`, `:latest`)
# çekiyordu. "Offline VE tekrar üretilebilir" iddiası hareketli etiketle
# **teknik olarak yanlıştır**: aynı `docker-compose.yml` üç ay sonra farklı
# imajlar çeker, jürinin gördüğü sistem bizim test ettiğimiz sistem olmaz.
# Etiket okunabilirlik için bırakıldı; bağlayıcı olan digest'tir.
#
# Digest'ler 2026-07-31'de `docker buildx imagetools inspect <imaj>` ile
# çözüldü (çözüm çıktısı docs/OFFLINE-KANIT.md "Digest pin tablosu"nda arşivli).
# Yenilemek için:
#
#   docker buildx imagetools inspect pgvector/pgvector:pg16 | grep Digest
#
# Digest yenilenirse OFFLINE-KANIT.md tablosu da güncellenmeli; aksi halde
# belge ile dosya çelişir.

services:
  postgres:
    # PostgreSQL + pgvector (açık kaynak, PostgreSQL lisansı)
    image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    environment:
      POSTGRES_USER: anatolia
      POSTGRES_PASSWORD: anatolia
      POSTGRES_DB: anatolia
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anatolia"]
      interval: 5s
      timeout: 3s
      retries: 10

  vllm:
    # Apache-2.0, OpenAI-uyumlu sunucu.
    image: vllm/vllm-openai:latest@sha256:ffb2d59b1c059a5bd8d781320c9f5189de8293693b7d95da54befddaa54abf52
    # Model KORUNUYOR: lisans zinciri 2026-07-31'de doğrulandı —
    # license: Apache-2.0; zincir Qwen3-8B-Base -> Qwen3-8B -> Trendyol-LLM-8B-T1.
    # Zincirde Llama/Gemma YOK, ticari-olmayan kısıt YOK => §5.10 uyumlu.
    command: >
      --model Trendyol/Trendyol-LLM-8B-T1
      --quantization awq --max-model-len 8192
    environment:
      HF_HUB_OFFLINE: "1"                # offline: önceden indirilmiş ağırlık
    volumes:
      # ÖN KOŞUL: `./models` ağırlıklarla ÖNCEDEN doldurulmuş olmalı. HF_HUB_OFFLINE=1
      # ile vLLM indirmeye çalışmaz; klasör boşsa servis başlamaz (sessizce
      # internete çıkmaz — istenen davranış bu). İndirme prosedürü:
      # docs/OFFLINE-KANIT.md "Ağırlık bütünlüğü". Bu dizin repoda YOK (ağırlıklar
      # git'e girmez) ve `docker compose up` onu boş oluşturur.
      - ./models:/root/.cache/huggingface
    ports:
      - "8001:8000"
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]

  ollama:
    # MIT, demo yedeği (CPU/GPU)
    image: ollama/ollama:latest@sha256:4dea9fb511947e24a84237bb636b0203abcb2ff0d3fbc7b4ff865deb91362131
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    profiles: ["ollama"]

  api:
    build: { context: ., dockerfile: Dockerfile.api }
    environment:
      DATABASE_PATH: ":memory:"          # demo: önceden doldurulmuş in-memory
      BANKS_CONFIG: config/banks.yaml
      RAW_DIR: data/raw
      LLM_BACKEND: ""                    # "vllm"/"ollama" ile aktifleştir
      VLLM_URL: http://vllm:8000
      OLLAMA_URL: http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: { context: ./web, dockerfile: Dockerfile }
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  ollama:
