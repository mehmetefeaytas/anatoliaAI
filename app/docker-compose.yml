# Anatolia AI — tek komutla offline, API anahtarsız ayağa kalkar.
# İlgili: ../decisions/on-premise-calistirilabilir-mimari.md, CLAUDE.md §7, §20
#         docs/OFFLINE-KANIT.md (ölçülmüş `--network none` kanıtı + digest tablosu)
#         docs/veri-katmani.md (backend seçimi: SQLite mi Postgres mi)
#
# ## PROFİLLER — hangisi ne zaman
#
#   docker compose up                      # VARSAYILAN: api + web, SQLite/offline
#   docker compose --profile postgres up   # + PostgreSQL 16 + pgvector
#   docker compose --profile gpu up        # + vLLM (GPU gerekir)
#   docker compose --profile ollama up     # + Ollama (CPU yedeği)
#
# ### Varsayılan (SQLite) — jüri demosu bunu görmeli
#
# Hiçbir profil verilmezse Postgres AYAĞA KALKMAZ ve API önceden doldurulmuş
# SQLite dosyasından okur (CLAUDE.md §11). Bir veritabanı sunucusunun hazır
# olmasını beklemeden açılır; 4 dakikalık sunumda beklenecek tek bir servis
# bile fazladır.
#
# 31 Tem 2026'ya kadar bu dosya ÇELİŞKİLİYDİ: `postgres` servisi koşulsuz
# ayağa kalkıyor, `api` ona `depends_on` ile bağlanıyor, ama aynı `api`
# `DATABASE_PATH=":memory:"` ile çalışıyordu — yani Postgres bekleniyor ama
# HİÇ KULLANILMIYORDU. Jüriye "mimarimiz Postgres üzerine kurulu" demek ile
# çalışan sistemde Postgres'e tek bir sorgu bile gitmemesi arasındaki fark
# tam olarak bu satırlardaydı.
#
# ### `--profile postgres` — pgvector yolu
#
# PostgreSQL + pgvector ayağa kalkar; `schema.sql` initdb ile uygulanır
# (`vector` eklentisi, `embeddings` tablosu, IVFFlat dizini dâhil).
# Doğrulama (gerçekten koşar, ölçülmüş bir kanıttır):
#
#   docker compose --profile postgres up -d postgres
#   docker compose --profile postgres run --rm db-check
#
# Bu profil AYRICA ikinci bir API konteyneri (`api-postgres`, 8010) açar.
# Neden ayrı servis: Compose aynı servisin ortam değişkenini profile göre
# değiştiremez. İki uç yan yana koştuğu için "API veri tabanından bağımsız"
# iddiası ÖLÇÜLEBİLİR hale gelir:
#
#   curl -s localhost:8000/health   ->  {"backend":"sqlite",...}
#   curl -s localhost:8010/health   ->  {"backend":"postgres",...}
#   diff <(curl -s localhost:8000/banks) <(curl -s localhost:8010/banks)
#
# DİKKAT — korpus asimetrisi: `api` önceden doldurulmuş `data/demo.db`'den
# 849 belge okur. `api-postgres` BOŞ bir Postgres bulursa fixture'lardan
# tohumlar, yani **3 belge** görür (`repo.counts()["campaigns"] == 0` koşulu).
# `data/demo.db` bir SQLite dosyasıdır; Postgres yolu onu okuyamaz. 849 belgeyi
# Postgres'e taşıyan bir betik repoda YOK — bu iş elle yapıldı
# (docs/veri-katmani.md §5.2). Sayıların farklı olması bir hata değil, kapsam
# farkıdır; ama sessiz kalmasın diye burada yazılıdır.
#
# Gömme üretimi (bge-m3 ağırlığı GEREKİR, ince API imajında yoktur —
# geliştirme ortamında koşturun):
#
#   DATABASE_URL=postgresql://anatolia:anatolia@localhost:5432/anatolia \
#     python3 -m src.rag.build_embeddings
#
# LLM: vllm (GPU) birincil; gpu yoksa ollama profili (`--profile ollama`).
#
# ## NEDEN DIGEST PIN (`@sha256:...`)
#
# Bu dosya daha önce üç imajı da hareketli etiketle (`:pg16`, `:latest`)
# çekiyordu. "Offline VE tekrar üretilebilir" iddiası hareketli etiketle
# **teknik olarak yanlıştır**: aynı `docker-compose.yml` üç ay sonra farklı
# imajlar çeker, jürinin gördüğü sistem bizim test ettiğimiz sistem olmaz.
# Etiket okunabilirlik için bırakıldı; bağlayıcı olan digest'tir.
#
# Digest'ler 2026-07-31'de `docker buildx imagetools inspect <imaj>` ile
# çözüldü (çözüm çıktısı docs/OFFLINE-KANIT.md "Digest pin tablosu"nda arşivli).
# Yenilemek için:
#
#   docker buildx imagetools inspect pgvector/pgvector:pg16 | grep Digest
#
# Digest yenilenirse OFFLINE-KANIT.md tablosu da güncellenmeli; aksi halde
# belge ile dosya çelişir.

services:
  postgres:
    # PostgreSQL + pgvector (açık kaynak, PostgreSQL lisansı).
    # `profiles` ile OPT-IN: varsayılan demo yolu SQLite'tır (yukarı bkz.).
    image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: anatolia
      POSTGRES_PASSWORD: anatolia
      POSTGRES_DB: anatolia
    volumes:
      - pgdata:/var/lib/postgresql/data
      # initdb yalnızca BOŞ veri dizininde çalışır. Şema değişirse ya
      # `docker compose down -v` ile hacim silinmeli ya da kod tarafındaki
      # idempotent `PostgresRepository.ensure_schema()` çağrısına güvenilmeli
      # (o da aynı dosyayı uygular — tek doğruluk kaynağı src/db/schema.sql).
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anatolia"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-check:
    # Postgres/pgvector yolunun ÇALIŞTIĞINI kanıtlayan tek seferlik koşu.
    #
    #   docker compose --profile postgres run --rm db-check
    #
    # `tests/` ve `psycopg[binary]` teslim API imajında zaten var
    # (bkz. Dockerfile.api, requirements-api.txt), o yüzden ek imaj gerekmez.
    # Testler iki backend'in AYNI cevabı verdiğini (parite) ve `embeddings`
    # tablosunun gerçekten yazılıp `<=>` ile sorgulandığını doğrular.
    # Ön koşul yoksa testler ATLANIR — "geçti" demez.
    build: { context: ., dockerfile: Dockerfile.api }
    profiles: ["postgres"]
    environment:
      # Üretim `DATABASE_URL`'i DEĞİL ayrı bir değişken: test şemayı temizler.
      ANATOLIA_TEST_DATABASE_URL: postgresql://anatolia:anatolia@postgres:5432/anatolia
    command: ["python", "-m", "unittest", "tests.test_pgvector_repository", "-v"]
    depends_on:
      postgres:
        condition: service_healthy

  vllm:
    # Apache-2.0, OpenAI-uyumlu sunucu.
    image: vllm/vllm-openai:latest@sha256:ffb2d59b1c059a5bd8d781320c9f5189de8293693b7d95da54befddaa54abf52
    # Model KORUNUYOR: lisans zinciri 2026-07-31'de doğrulandı —
    # license: Apache-2.0; zincir Qwen3-8B-Base -> Qwen3-8B -> Trendyol-LLM-8B-T1.
    # Zincirde Llama/Gemma YOK, ticari-olmayan kısıt YOK => §5.10 uyumlu.
    command: >
      --model Trendyol/Trendyol-LLM-8B-T1
      --quantization awq --max-model-len 8192
    environment:
      HF_HUB_OFFLINE: "1"                # offline: önceden indirilmiş ağırlık
    volumes:
      # ÖN KOŞUL: `./models` ağırlıklarla ÖNCEDEN doldurulmuş olmalı. HF_HUB_OFFLINE=1
      # ile vLLM indirmeye çalışmaz; klasör boşsa servis başlamaz (sessizce
      # internete çıkmaz — istenen davranış bu). İndirme prosedürü:
      # docs/OFFLINE-KANIT.md "Ağırlık bütünlüğü". Bu dizin repoda YOK (ağırlıklar
      # git'e girmez) ve `docker compose up` onu boş oluşturur.
      - ./models:/root/.cache/huggingface
    ports:
      - "8001:8000"
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]

  ollama:
    # MIT, demo yedeği (CPU/GPU)
    #
    # ÖNBELLEK PROSEDÜRÜ — offline demodan ÖNCE bir kez, internet varken:
    #
    #   docker compose --profile ollama up -d ollama
    #   docker compose exec ollama ollama pull qwen2.5:7b-instruct   # 4,7 GB
    #   docker compose exec ollama ollama list                       # doğrula
    #
    # Ağırlık `ollama` adlı adlandırılmış hacimde kalıcıdır; sonraki
    # koşumlar internetsiz açılır. Bu adım ATLANIRSA `LLM_BACKEND=ollama`
    # ilk istekte "model not found" ile düşer — ağ olmadığı için `pull`
    # kendini kurtaramaz. Etiket birebir eşleşmelidir: `qwen2.5:7b`
    # kısaltması ÇÖZÜLMEZ (gerekçe: src/extraction/llm/clients.py:432-437).
    #
    # Model künyesi: qwen2.5:7b-instruct, Q4_K_M, Apache-2.0, kök depo
    # `Qwen/Qwen2.5-7B` (docs/model-license-audit.md §1).
    image: ollama/ollama:latest@sha256:4dea9fb511947e24a84237bb636b0203abcb2ff0d3fbc7b4ff865deb91362131
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    profiles: ["ollama"]

  api:
    build: { context: ., dockerfile: Dockerfile.api }
    environment:
      # OFFLINE DEMO YOLU (varsayılan): önceden doldurulmuş SQLite dosyası.
      # `scripts/build_demo_db.py` ile üretilen data/demo.db imaja kopyalanır
      # (Dockerfile.api: `COPY data/ ./data/`). Dosya yoksa API açılışta
      # fixture'lardan tohumlar (`repo.counts()["campaigns"] == 0` koşulu),
      # yani sistem yine çalışır — sadece korpus küçük olur (3 fixture
      # kampanyası, 1.782 yerine). `data/demo.db` `.gitignore`'dadır, yani
      # TEMİZ BİR KLONDA YOKTUR — bu tam olarak jürinin karşılaştığı durum.
      #
      # BİLEREK OTOMATİKLEŞTİRİLMEDİ (compose'a init/seed servisi olarak
      # eklenmedi): `build_demo_db` ~4-5 dakika sürüyor (ölçüldü: 282 s,
      # 1.782 belge -> 1.782 kampanya, bkz. README "Tam Sistem" bölümü) ve
      # `COPY data/ ./data/` DERLEME ANINDA çalıştığı için bir çalışma-zamanı
      # init konteyneri zaten geç kalırdı (imaj o ana kadar demo.db'siz
      # derlenmiş olurdu). Ayrıca her `docker compose up`'ta 4-5 dakika
      # beklemek CLAUDE.md §11'i ("4 dakikalık sunumda beklenecek tek bir
      # servis bile fazladır") doğrudan ihlal ederdi. Doğru sıralama: derleme
      # ÖNCESİ, elle, BİR KEZ `python3 -m scripts.build_demo_db --out
      # data/demo.db` çalıştırıp sonra `docker compose build`/`up` etmek.
      #
      # Neden ":memory:" değil: bellek içi DB her yeniden başlatmada 849
      # belgelik korpusu ATAR ve fixture'lara düşer; jüri demoda ikinci kez
      # yeniden başlatırsa farklı bir sistem görürdü.
      DATABASE_PATH: data/demo.db
      # DATABASE_URL Postgres yolunu açar (boşsa SQLite). `src/api/main.py`
      # ARTIK `create_repository()` fabrikasını kullanıyor, yani bu değişken
      # gerçekten OKUNUYOR — 31 Tem 2026'ya kadar okunmuyordu ve bu yüzden
      # burada ilan edilmiyordu.
      #
      # Varsayılan BOŞ: jüri demosu bir veritabanı sunucusu beklemeden açılmalı.
      # `${DATABASE_URL:-}` biçimi kabuktan/`.env`'den geçirmeye izin verir ama
      # varsayılanı değiştirmez. Postgres'e bağlı API için `--profile postgres`
      # ile gelen `api-postgres` servisine bakın.
      DATABASE_URL: ${DATABASE_URL:-}
      BANKS_CONFIG: config/banks.yaml
      RAW_DIR: data/raw
      # Varsayılan BOŞ = kural-only. Jüri demosu bir LLM beklemeden açılmalı
      # (CLAUDE.md §11). `${LLM_BACKEND:-}` biçimi — `DATABASE_URL` ile aynı
      # desen — kabuktan/`.env`'den `vllm`/`ollama` geçirmeye izin verir ama
      # varsayılanı değiştirmez. Sabit `""` idi: değişkeni ilan edip
      # geçirilemez yapmak, olmayan bir düğmeyi belgelemekti.
      LLM_BACKEND: ${LLM_BACKEND:-}
      VLLM_URL: http://vllm:8000
      # vLLM servisi (satır 130) `--model Trendyol/Trendyol-LLM-8B-T1` ile
      # açılıyor ama bu satır YOKTU ve `clients.py:214` varsayılanı
      # `Qwen/Qwen3-8B`. Yani `LLM_BACKEND=vllm` denenen ilk koşum, sunucuda
      # SERVİS EDİLMEYEN bir model adı isteyip düşerdi. Ollama kolunda birebir
      # aynı hata bir kez yaşanmış ve `clients.py:434-437`de yazılı; aynı
      # tuzağın vLLM kolunda açık kalması sürüyordu. Sunucu ile istemcinin
      # model adı TEK KAYNAKTAN gelsin diye ikisi de aynı değişkene bağlandı.
      VLLM_MODEL: ${VLLM_MODEL:-Trendyol/Trendyol-LLM-8B-T1}
      OLLAMA_URL: http://ollama:11434
      # `clients.py:437` varsayılanıyla birebir aynı. Şu an tesadüfen doğru
      # çalışıyor; açıkça yazmak, varsayılan bir gün kayarsa sessiz
      # "model not found" yerine görünür bir uyuşmazlık bırakır.
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      # RAG retriever seçimi: keyword (varsayılan, üretim yolu) | auto | vector
      # bkz. src/chatbot/rag.build_retriever
      RAG_RETRIEVER: keyword
      # --- kimlik doğrulama (GELEN istekler) — varsayılan BOŞ = KAPALI ---
      # `${VAR:-}` deseni `DATABASE_URL`/`LLM_BACKEND` ile aynı gerekçe:
      # kabuktan ya da `.env`den geçirilebilir olsun ama VARSAYILANI
      # değiştirmesin. Jüri demosu ve `--network none` çevrimdışı kanıt koşumu
      # anahtar dağıtımı beklemeden açılmalı; boş bırakıldığında API bugünkü
      # gibi anahtarsız çalışır ve bu durumu açılışta log'a UYARI olarak yazar.
      #
      # Üretimde doldurulduğunda `/health` DIŞINDA tüm uçlar `X-API-Key` ya da
      # `Authorization: Bearer` ister. `/health` bilerek muaf: bu compose
      # dosyasının yukarıdaki doğrulama komutları ve konteyner sağlık probu onu
      # ağsız ortamda, anahtarsız çağırıyor (docs/OFFLINE-KANIT.md adım 7-8).
      #
      # DİKKAT — `web` servisi: anahtar açıldığında panel de anahtar taşımak
      # zorundadır. Anahtarı `NEXT_PUBLIC_*` ile geçirmek onu TARAYICIYA
      # sızdırır; doğru yol kurumun ters vekil sunucusunun (reverse proxy)
      # anahtarı sunucu tarafında enjekte etmesidir. Gerekçe ve seçenekler:
      # docs/kimlik-dogrulama.md "Panel ve geçit".
      API_KEYS: ${API_KEYS:-}
      API_KEYS_READONLY: ${API_KEYS_READONLY:-}
      # Dosya yolu verilirse API onu okur; VERİLİP okunamazsa açılışta DÜŞER
      # (doğrulamasız açılmaktan iyidir).
      API_KEYS_FILE: ${API_KEYS_FILE:-}
    ports:
      - "8000:8000"
    # `depends_on: postgres` YOK ve OLMAMALI: varsayılan profilde `api` SQLite
    # ile koşar, Postgres hiç ayağa kalkmaz. Bekletmek, kullanılmayan bir
    # bağımlılığı kullanılıyormuş gibi gösterirdi. Postgres'i BEKLEYEN uygulama
    # ayrı bir servistir (`api-postgres`) ve orada `depends_on` gerçekten yük
    # taşır.

  api-postgres:
    # AYNI imaj, AYNI kod — yalnız `DATABASE_URL` dolu.
    #
    #   docker compose --profile postgres up -d postgres api-postgres
    #   curl -s localhost:8010/health   -> {"backend":"postgres",...}
    #
    # Varsayılan profilde AYAĞA KALKMAZ (`profiles`), yani jüri demosu
    # etkilenmez. Port 8010 bilinçli: 8000 varsayılan `api`'nin, 8001 vLLM'in.
    build: { context: ., dockerfile: Dockerfile.api }
    profiles: ["postgres"]
    environment:
      # Tek fark bu satır. `postgres` servis adı Compose ağında çözülür.
      DATABASE_URL: postgresql://anatolia:anatolia@postgres:5432/anatolia
      # DATABASE_PATH bilerek YOK: `DATABASE_URL` dolu olduğunda
      # `create_repository()` SQLite yolunu hiç değerlendirmez. Buraya bir
      # değer yazmak, okunmayan bir ayarı ilan etmek olurdu.
      BANKS_CONFIG: config/banks.yaml
      RAW_DIR: data/raw
      # `api` ile birebir aynı gerekçe (yukarı bkz.): geçirilebilir varsayılan
      # + sunucu/istemci model adının tek kaynaktan gelmesi. İki servis AYNI
      # imajı koştuğu için ayrışmaları sessiz bir davranış farkı üretirdi.
      LLM_BACKEND: ${LLM_BACKEND:-}
      VLLM_URL: http://vllm:8000
      VLLM_MODEL: ${VLLM_MODEL:-Trendyol/Trendyol-LLM-8B-T1}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
      RAG_RETRIEVER: keyword
      # Kimlik doğrulama — `api` servisiyle BİREBİR aynı gerekçe (yukarı bkz.).
      # İki servis AYNI imajı koşuyor; ayrışmaları, aynı kodun iki uçta farklı
      # güvenlik davranışı göstermesi olurdu.
      API_KEYS: ${API_KEYS:-}
      API_KEYS_READONLY: ${API_KEYS_READONLY:-}
      API_KEYS_FILE: ${API_KEYS_FILE:-}
    ports:
      - "8010:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: { context: ./web, dockerfile: Dockerfile }
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  ollama:
